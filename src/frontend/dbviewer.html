<!doctype html>
<!-- Ashurbanipal dbviewer — single-file frontend (design.md §3.1).
     v1 scaffold: functional table browser, plain-text cells.
     TODO before v1 done: @alenaksu/json-viewer for jsonb cells (CDN,
     degraded fallback), Prism highlighting — see cdn-research.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashurbanipal</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: ui-monospace, monospace;
    --border: #8884;
    --border-strong: #8886;
    --hover: #8882;
    --danger: light-dark(#d33, #f66);
    --success: light-dark(#2a2, #5c5);
    --active: light-dark(#08f2, #08f5);
    --backdrop: light-dark(#0006, #0009);
    --gap: .5rem;
    --gap-lg: .75rem;
  }

  /* ==== Layout ==== */
  body { margin: 0; display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
  nav { border-right: 1px solid var(--border); padding: var(--gap-lg); overflow-y: auto; }
  main { padding: var(--gap-lg); overflow: auto; }
  h1 { font-size: 1rem; margin: 0 0 var(--gap); }

  /* ==== Sidebar table list ==== */
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; text-align: left; background: none; border: none;
              padding: .3rem .4rem; cursor: pointer; font: inherit; color: inherit;
              border-radius: 4px; display: flex; justify-content: space-between; }
  li button:hover { background: var(--hover); }
  li button.active { background: var(--active); }
  .count { opacity: .6; }

  /* ==== Data table ==== */
  table { border-collapse: collapse; width: 100%; margin-top: var(--gap); }
  th, td { border: 1px solid var(--border); padding: .25rem var(--gap); text-align: left; }
  th { cursor: pointer; user-select: none; }
  th[aria-sort="ascending"]::after { content: " ▲"; }
  th[aria-sort="descending"]::after { content: " ▼"; }
  td { position: relative; padding-right: 1.6rem; }
  .cell-text { display: block; max-width: 24rem; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  button.cell-text { background: none; border: none; padding: 0; margin: 0;
                     font: inherit; color: inherit; text-align: left; cursor: inherit; }
  td.expandable .cell-text { cursor: zoom-in; }
  .copy { position: absolute; right: .15rem; top: 50%; transform: translateY(-50%);
          background: none; border: none; cursor: pointer; font: inherit;
          color: inherit; opacity: 0; padding: 0 .15rem; border-radius: 3px; }
  td:hover .copy, .copy:focus-visible { opacity: .7; }
  .copy:hover { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }

  /* ==== Controls / status ==== */
  #controls { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
  /* display: contents keeps #filter/#apply flex items of #controls directly,
     so wrapping them in a <form> (for native Enter-to-submit) doesn't change layout. */
  #filter-form { display: contents; }
  #filter { flex: 1; min-width: 12rem; font: inherit; padding: .25rem; field-sizing: content; }
  #status { opacity: .6; }
  #error { color: var(--danger); margin-top: var(--gap); white-space: pre-wrap; }
  .empty td { text-align: center; opacity: .6; padding: 1rem; }

  /* ==== Siblings ==== */
  #siblings { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: var(--gap); }
  .dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%;
         margin-right: .4em; background: #999; }
  .dot.up { background: var(--success); } .dot.down { background: var(--danger); }

  /* ==== Pager ==== */
  #pager { margin-top: var(--gap); display: flex; gap: var(--gap); align-items: center; }

  /* Raw-payload viewer: native <dialog> — showModal() gives backdrop,
     Esc-to-close, and focus trapping for free. */
  dialog { border: 1px solid var(--border-strong); border-radius: 8px; padding: 0;
           max-width: min(60rem, 92vw); max-height: 80vh; }
  dialog::backdrop { background: var(--backdrop); }
  .dialog-head { display: flex; justify-content: space-between; align-items: center;
                 gap: 1rem; padding: var(--gap) var(--gap-lg); border-bottom: 1px solid var(--border); }
  .dialog-head button { background: none; border: none; cursor: pointer;
                        font: inherit; color: inherit; }
  dialog pre { margin: 0; padding: var(--gap-lg); overflow: auto;
               max-height: calc(80vh - 3rem); }

  /* Cell preview: native Popover API — non-modal, light-dismiss (click
     anywhere outside closes it). Positioned via CSS Anchor Positioning:
     the clicked cell gets anchor-name set in JS, and position-try-fallbacks
     flips the popover away from the viewport edge with no clamping math.
     Unsupported browsers just ignore these properties and fall back to the
     popover's default position — degraded placement, not breakage. */
  #cell-pop { position: fixed; position-anchor: --cell-anchor;
              position-try-fallbacks: flip-block, flip-inline;
              inset: auto; top: calc(anchor(bottom) + .3rem); left: anchor(left);
              margin: 0; border: 1px solid var(--border-strong);
              border-radius: 8px; padding: 0; max-width: min(40rem, 90vw);
              box-shadow: 0 4px 16px #0004; }
  #cell-pop pre { margin: 0; padding: .6rem var(--gap-lg); overflow: auto;
                  max-height: 50vh; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<nav>
  <h1>Ashurbanipal</h1>
  <ul id="tables"></ul>
  <div id="siblings"></div>
</nav>
<main>
  <search id="controls">
    <strong id="current">—</strong>
    <span id="status" aria-live="polite"></span>
    <form id="filter-form">
      <input id="filter" type="search" enterkeyhint="search" placeholder="filter: column OP value AND …" >
      <button id="apply">apply</button>
    </form>
    <button id="payload" disabled title="raw JSON response for the current view">payload</button>
  </search>
  <div id="error" role="alert"></div>
  <table tabindex="-1"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  <div id="pager">
    <button id="prev">‹ prev</button>
    <span id="page"></span>
    <button id="next">next ›</button>
  </div>
</main>

<dialog id="payload-dialog" closedby="any">
  <div class="dialog-head">
    <strong>response payload</strong>
    <form method="dialog"><button type="submit" aria-label="close">✕</button></form>
  </div>
  <pre id="payload-pre"></pre>
</dialog>

<div id="cell-pop" popover><pre id="cell-pre"></pre></div>
<script type="module">
const API = "/__ashurbanipal/api";
const UI_KEY = "ashurbanipal_ui";

// UI state persisted in localStorage (design.md §3.1): table names and view
// prefs only — never filters (they can contain data values), never row data.
let state = { table: null, sort: null, order: "asc", limit: 50, offset: 0 };
try {
  const saved = JSON.parse(localStorage.getItem(UI_KEY) || "{}");
  for (const k of ["table", "sort", "order", "limit"])
    if (saved[k] !== undefined) state[k] = saved[k];
} catch { localStorage.removeItem(UI_KEY); }
function persist() {
  const { table, sort, order, limit } = state;
  localStorage.setItem(UI_KEY, JSON.stringify({ table, sort, order, limit }));
}

const $ = (id) => document.getElementById(id);
const setStatus = (text) => { $("status").textContent = text; };

async function api(path) {
  const resp = await fetch(API + path);
  if (!resp.ok) throw new Error(await resp.text());
  return resp.json();
}

// ---- raw payload viewer (<dialog>) ----
let lastPayload = null;
$("payload").onclick = () => {
  $("payload-pre").textContent = JSON.stringify(lastPayload, null, 2);
  $("payload-dialog").showModal();
};
// Close button is a <form method="dialog"> submit; closedby="any" on the
// <dialog> itself handles backdrop-click dismiss — no JS needed for either.

// ---- per-cell copy (Clipboard API) ----
async function copyText(text, btn) {
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
    } else {
      // Clipboard API needs a secure context (https/localhost); fall back
      // for plain-http internal hosts.
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    btn.textContent = "✓";
  } catch { btn.textContent = "✗"; }
  setTimeout(() => { btn.textContent = "⧉"; }, 800);
}

// ---- cell preview (Popover API: light-dismiss, non-modal; positioned via
// CSS Anchor Positioning — see #cell-pop's position-anchor/position-try-fallbacks) ----
let cellPopAnchor = null;
function showCellPop(e, text) {
  // jsonb (and any JSON-shaped value) pretty-prints; everything else raw.
  let pretty = text;
  try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch { /* not JSON */ }
  $("cell-pre").textContent = pretty;
  if (cellPopAnchor) cellPopAnchor.style.anchorName = "";
  cellPopAnchor = e.currentTarget;
  cellPopAnchor.style.anchorName = "--cell-anchor";
  $("cell-pop").showPopover();
}

async function loadTables() {
  setStatus("loading tables…");
  const [{ tables }, { counts }] = await Promise.all([
    api("/tables"), api("/table-counts"),
  ]);
  const countMap = Object.fromEntries(counts.map(c => [c.table, c.approx_rows]));
  const ul = $("tables");
  ul.innerHTML = "";
  for (const t of tables) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.innerHTML = `<span></span><span class="count"></span>`;
    btn.firstChild.textContent = t;
    btn.lastChild.textContent = `~${countMap[t] ?? "?"}`;
    btn.dataset.table = t;
    btn.onclick = () => { state.table = t; state.offset = 0; state.sort = null; persist(); loadData(); };
    li.appendChild(btn);
    ul.appendChild(li);
  }
  // Stale persisted state must never wedge the UI: fall back silently.
  if (!tables.includes(state.table)) state.table = tables[0] ?? null;
  if (state.table) loadData();
  else setStatus("");
}

async function fetchTableData() {
  const params = new URLSearchParams({
    table: state.table, limit: state.limit, offset: state.offset,
  });
  if (state.sort) { params.set("sort", state.sort); params.set("order", state.order); }
  const filter = $("filter").value.trim();
  if (filter) params.set("filter", filter);
  setStatus("loading…");
  document.querySelector("table").setAttribute("aria-busy", "true");
  try {
    return await api("/tables/data?" + params);
  } finally {
    setStatus("");
    document.querySelector("table").removeAttribute("aria-busy");
  }
}

function renderHeader(columns) {
  const tr = document.createElement("tr");
  for (const col of columns) {
    const th = document.createElement("th");
    th.textContent = `${col.name} (${col.type})`;
    th.setAttribute("aria-sort", col.name === state.sort
      ? (state.order === "desc" ? "descending" : "ascending")
      : "none");
    th.onclick = () => {
      state.order = state.sort === col.name && state.order === "asc" ? "desc" : "asc";
      state.sort = col.name; state.offset = 0; persist(); loadData();
    };
    tr.appendChild(th);
  }
  $("thead").replaceChildren(tr);
}

function renderEmptyState(columnCount) {
  const emptyRow = document.createElement("tr");
  emptyRow.className = "empty";
  const td = document.createElement("td");
  td.colSpan = columnCount;
  td.textContent = state.offset > 0 ? "No more rows." : "No rows match this view.";
  emptyRow.appendChild(td);
  $("tbody").replaceChildren(emptyRow);
}

function renderRows(data) {
  if (data.rows.length === 0) {
    renderEmptyState(data.columns.length);
    return;
  }
  const tbody = $("tbody");
  tbody.replaceChildren(...data.rows.map(row => {
    const tr = document.createElement("tr");
    for (const col of data.columns) {
      const td = document.createElement("td");
      const raw = row[col.name];
      // A real <button> as the click target (not the <td> itself) so the
      // expand action is keyboard-focusable and Enter/Space-activatable,
      // matching the copy button one element over.
      const cellText = document.createElement(raw != null ? "button" : "span");
      cellText.className = "cell-text";
      if (raw != null && (col.type === "timestamp with time zone" || col.type === "date")) {
        const time = document.createElement("time");
        time.dateTime = raw;
        time.textContent = raw;
        cellText.appendChild(time);
      } else {
        cellText.textContent = raw ?? "∅";
      }
      td.appendChild(cellText);
      if (raw != null) {
        const btn = document.createElement("button");
        btn.className = "copy";
        btn.setAttribute("aria-label", "copy cell value");
        btn.textContent = "⧉";
        btn.onclick = (e) => { e.stopPropagation(); copyText(raw, btn); };
        td.appendChild(btn);
        // Expand on click for jsonb, or anything visually truncated.
        // scrollWidth > clientWidth is only known after layout, so decide
        // per click rather than per render.
        cellText.onclick = (e) => {
          if (col.type === "jsonb" || cellText.scrollWidth > cellText.clientWidth) {
            showCellPop(e, raw);
          }
        };
        if (col.type === "jsonb") td.classList.add("expandable");
      }
      tr.appendChild(td);
    }
    return tr;
  }));
  // Overflow is only measurable after layout: mark truncated cells so the
  // cursor hints they're expandable (jsonb cells are marked at render).
  requestAnimationFrame(() => {
    for (const el of tbody.querySelectorAll(".cell-text")) {
      if (el.scrollWidth > el.clientWidth) el.closest("td").classList.add("expandable");
    }
  });
}

function updatePager(data) {
  const page = Math.floor(state.offset / state.limit) + 1;
  $("page").textContent = `page ${page} · ~${data.total_approx} rows`;
  $("prev").disabled = state.offset === 0;
  $("next").disabled = data.rows.length < state.limit;
}

// ---- focus preservation across tbody re-renders ----
// replaceChildren() detaches whatever was focused inside it, and the browser
// silently falls back to <body> — a real defect for keyboard users on every
// sort/page/filter change. Capture the focused cell's position before the
// replace and restore focus to the same slot afterward, falling back to the
// table itself (tabindex="-1") if that slot no longer exists.
function captureTbodyFocus() {
  const active = document.activeElement;
  const tbody = $("tbody");
  if (!active || !tbody.contains(active)) return null;
  const td = active.closest("td");
  const tr = active.closest("tr");
  if (!td || !tr) return null;
  return {
    rowIndex: [...tr.parentElement.children].indexOf(tr),
    colIndex: [...tr.children].indexOf(td),
    isCopy: active.classList.contains("copy"),
  };
}

function restoreTbodyFocus(captured) {
  if (!captured) return;
  const tr = $("tbody").children[captured.rowIndex];
  const td = tr?.children[captured.colIndex];
  const target = td?.querySelector(captured.isCopy ? ".copy" : ".cell-text");
  (target ?? document.querySelector("table")).focus();
}

async function loadData() {
  $("error").textContent = "";
  document.querySelectorAll("#tables button").forEach(b => {
    const isActive = b.dataset.table === state.table;
    b.classList.toggle("active", isActive);
    if (isActive) b.setAttribute("aria-current", "true");
    else b.removeAttribute("aria-current");
  });
  $("current").textContent = state.table ?? "—";
  if (!state.table) { setStatus(""); return; }
  let data;
  try { data = await fetchTableData(); }
  catch (e) { $("error").textContent = e.message; return; }
  lastPayload = data;
  $("payload").disabled = false;
  const focusCapture = captureTbodyFocus();
  renderHeader(data.columns);
  renderRows(data);
  updatePager(data);
  restoreTbodyFocus(focusCapture);
}

async function loadSiblings() {
  let siblings = [];
  try { ({ siblings } = await api("/siblings")); } catch { /* leave empty */ }
  const div = $("siblings");
  div.replaceChildren(...siblings.map(s => {
    const p = document.createElement("div");
    const dot = document.createElement("span");
    dot.className = "dot " + (s.healthy ? "up" : "down");
    dot.setAttribute("role", "img");
    dot.setAttribute("aria-label", s.healthy ? "healthy" : "unhealthy");
    const a = document.createElement("a");
    a.href = s.dbviewer_url; a.textContent = s.name;
    p.append(dot, a);
    return p;
  }));
}

$("filter-form").onsubmit = (e) => { e.preventDefault(); state.offset = 0; loadData(); };
$("prev").onclick = () => { state.offset = Math.max(0, state.offset - state.limit); loadData(); };
$("next").onclick = () => { state.offset += state.limit; loadData(); };

loadTables().catch(e => { $("error").textContent = e.message; });
loadSiblings();
setInterval(loadSiblings, 10_000);
</script>
</body>
</html>
