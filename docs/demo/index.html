  --surface: light-dark(#f3f3f0, #26262a);
  --rule: light-dark(#eeeeea, #2e2e32);
  --rule-strong: color-mix(in srgb, currentColor 55%, transparent);
  --text-muted: light-dark(#6b6b68, #a0a09c);
  --chip-active-bg: light-dark(#1d1d1f, #ececea);
  --chip-active-fg: light-dark(#fff, #1a1a1c);
  --chip-h: 1.75rem;
  /* Scrollable content budget inside a modal <dialog> (max-height 80vh
     less the header). */
  --dialog-body-max-h: calc(80vh - 3rem);
  /* --type-* (grid/record cells) and --json-* (json tree tokens) share
     values for bool/number/uuid, so a value looks identical whether it's
     a top-level column or nested inside a jsonb blob. */
  --json-string: light-dark(#8f4a4a, #d4a0a0);
  --json-number: light-dark(#2f6b6b, #86bcbc);
  --json-bool: light-dark(#8a6a2e, #d6b980);
  --json-null: light-dark(#888, #999);
  --type-uuid: light-dark(#6e5a8a, #bba8d6);
  --type-bool: var(--json-bool);
  --type-number: var(--json-number);
  --type-date: light-dark(#3f7a5c, #8cc4a8);
  /* Transient wash on rows added since the last manual refresh. */
  --row-new-bg: light-dark(#e3f6e6, #1f3a26);
}

/* ==== Layout ==== */
/* Author-level display rules below would otherwise defeat the hidden
   attribute's UA-level display:none. */
[hidden] { display: none !important; }
body { margin: 0; height: 100vh; font-size: .875rem; }
/* main is the only scroller: the chrome scrolls away with the page and only
   the table header pins (thead th, top: 0). */
main { height: 100%; overflow: auto; }
/* sticky left keeps the chrome in view when a wide table scrolls sideways;
   it works because #content below is as wide as the table (see #content). */
#chrome { position: sticky; left: 0; padding: var(--gap-lg) var(--gap-xl) 0; }
/* width: max-content (floored at 100%) makes #content's own box grow to
   match a wide table's overflow instead of staying clipped to main's
   visible width. Without this, #pager's sticky `left` has no room to
   travel — its containing block (#content) is only as wide as the
   viewport, so once scrolled past that it runs out of stickiness and gets
   dragged along horizontally. */
#content { box-sizing: border-box; padding: 0 var(--gap-xl) var(--gap-lg); width: max-content; min-width: 100%; }

/* ==== Top bar ==== */
#topbar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--gap-lg); }
h1 { font-size: .9rem; margin: 0; font-weight: 600; }
h1 a { color: inherit; text-decoration: none; }
h1 a:hover { text-decoration: underline; text-underline-offset: .15em; }
#scope { display: flex; align-items: center; gap: var(--gap); }
#topbar-end { margin-left: auto; display: flex; align-items: center; gap: var(--gap); }
/* Hidden by default (single-source / single-schema deployments never show
   them — see loadSources / loadSchemas); no `source`/`schema` param is sent
   in that case, so the wire shape matches a build without the selectors. */
#source-select-wrap, #schema-select-wrap { display: flex; align-items: center; gap: .35rem;
                                           background: var(--surface); border-radius: 6px;
                                           padding: .2rem .25rem .2rem .6rem; }
.scope-label { font-size: .75rem; color: var(--text-muted); }
#source-select, #schema-select { border: none; background: transparent; font: inherit;
                                 color: inherit; padding: .1rem; cursor: pointer;
                                 max-width: 12rem; text-overflow: ellipsis; }

/* ==== Table chips ==== */
#tables-bar { display: flex; align-items: flex-start; gap: var(--gap); margin-top: var(--gap-lg); }
#nav-history { display: flex; flex: none; }
#nav-history button { background: none; border: none; font: inherit; font-size: 1.25rem;
                      height: var(--chip-h); line-height: 1; color: inherit; cursor: pointer;
                      padding: 0 .35rem; border-radius: 6px; }
#nav-history button:not(:disabled):hover { background: var(--hover); }
#nav-history button:disabled { opacity: .3; cursor: default; }
ul#tables { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: .25rem .125rem; position: relative; }
#tables-more-item { margin-left: auto; }
/* A chip pulled up from the hidden part of a collapsed list (see sidebar.ts). */
#tables li.pulled { position: relative; margin-left: .5rem; }
#tables li.pulled::before { content: ""; position: absolute; left: -.3rem; top: 25%; bottom: 25%;
                            width: 1px; background: var(--border-strong); }
ul { list-style: none; margin: 0; padding: 0; }
#tables li button { background: none; border: none; padding: 0 .65rem; height: var(--chip-h);
                    cursor: pointer; font: inherit; color: inherit; border-radius: 999px;
                    display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
#tables li button:hover { background: var(--hover); }
#tables li button.active { background: var(--chip-active-bg); color: var(--chip-active-fg); }
/* min-width:0 plus the cap lets one very long name ellipsize instead of
   widening the row; the full name is in `title` (see loadTables()). */
.row-name { font-family: var(--font-mono); font-size: .8125rem; max-width: 16rem; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; }
.row-right { position: relative; display: flex; align-items: center; flex: none; }
.count { font-size: .7rem; opacity: .6; }
/* Overlays the count while loading (absolutely positioned, so it adds no
   width and the chip row never reflows). */
.row-spinner { position: absolute; inset: 0; margin: auto; width: .6rem; height: .6rem;
               border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent;
               visibility: hidden; }
#tables li button.loading .count { visibility: hidden; }
#tables li button.loading .row-spinner { visibility: visible; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  #tables li button.loading .row-spinner { animation: none; border-top-color: currentColor; }
}
#tables-more { flex: none; background: none; border: none; font: inherit; font-size: .8rem;
               color: var(--text-muted); height: var(--chip-h); padding: 0 .5rem;
               cursor: pointer; border-radius: 6px; }
#tables-more:hover { background: var(--hover); color: inherit; }
/* One rotation per click, always run to completion (JS drops .spinning on a
   timer) so a sub-100ms re-fetch still acknowledges the click, separately
   from #status/aria-busy. inline-block so the rotate applies. */
#refresh-icon { display: inline-block; }
#refresh.spinning #refresh-icon { animation: spin .5s linear; }
@media (prefers-reduced-motion: reduce) {
  #refresh.spinning #refresh-icon { animation: none; }
}

/* ==== Data table ==== */
/* separate/0, not collapse: verified that collapsed borders let
   scrolled-under row content bleed through a sticky <th>'s background at
   the collapsed border seams in Chromium. Horizontal rules only. */
/* max-content, not auto: inside #content's own max-content box, auto lets the
   table inflate far past its natural width (a 5-column table rendered 3x wide). */
table { border-collapse: separate; border-spacing: 0; width: max-content; margin-top: var(--gap-lg); }
th, td { padding: .45rem .75rem .45rem 0; text-align: left; }
/* Border-box so the min-width from features/column-widths.ts is the column's
   measured width, not that plus padding (which would grow it every render). */
th { box-sizing: border-box; }
td { position: relative; border-bottom: 1px solid var(--rule);
     font-family: var(--font-mono); font-size: .8125rem; }
tbody tr:hover { background: var(--hover); }
th { cursor: pointer; user-select: none; white-space: nowrap; font-weight: 500;
     font-size: .75rem; border-bottom: 1px solid var(--rule-strong); }
/* z-index is load-bearing: td has position:relative (for the cell actions),
   and since tbody follows thead in DOM order, its positioned <td>s paint
   over a sticky <th> with the default stacking order unless the header is
   explicitly raised. */
thead th { position: sticky; top: 0; z-index: 1; background: canvas; }
/* Arrow always rendered (dim when unsorted), not just on the active
   column: keeps every th's width stable across sort changes and shows
   sortability before the first click. "↑" default previews the real
   first-click behavior (ascending — see th.onclick). */
/* Capped like the table chips' names; the title carries the full name. */
.col-name { display: inline-block; max-width: 16rem; overflow: hidden; text-overflow: ellipsis;
            vertical-align: bottom; }
th[aria-sort] .th-name::after { content: " ↑"; opacity: .35; }
th[aria-sort="ascending"] .th-name::after { content: " ↑"; opacity: 1; }
th[aria-sort="descending"] .th-name::after { content: " ↓"; opacity: 1; }
/* Decorative (aria-hidden) — the th carries an aria-label with the text
   equivalent. */
.key-icon { margin-right: .2rem; }
/* The engine-native column type, on its own line under the name so a long
   spelling ("timestamp with time zone") doesn't set the column's width. */
th code.col-type { display: block; width: fit-content; max-width: 10rem; overflow: hidden;
            text-overflow: ellipsis; margin-top: .1rem; font-family: var(--font-mono);
            font-size: .7rem; font-weight: normal; opacity: .75;
            background: color-mix(in srgb, currentColor 10%, transparent);
            padding: 0 .25em; border-radius: 3px; }
/* Not part of the sort click target — its onclick stops propagation so
   it doesn't also trigger th's sort handler. */
.common-values-btn { background: none; border: none; cursor: pointer; font: inherit;
            color: inherit; margin-left: .3rem; padding: 0 .15rem; border-radius: 3px; }
.common-values-btn:hover { background: var(--hover); }
/* Styled distinctly from the plain cell-text button so it doesn't read
   as an <a> hyperlink — it's an in-app state change, not navigation.
   The pk cell (reverse direction: what references this row) is the same
   family, dashed instead of dotted so the two never read alike — a
   column can be both pk and fk. */
.fk-cell, .pk-cell { cursor: pointer; text-decoration: underline dotted;
                     text-underline-offset: .15em; }
.pk-cell { text-decoration-style: dashed; }
.fk-cell:hover, .pk-cell:hover { text-decoration-style: solid; }
th.row-actions, td.row-actions { width: 1%; white-space: nowrap; cursor: default; }
td.row-actions { padding-right: .25rem; }
.record-btn { background: none; border: none; cursor: pointer; font: inherit;
              color: var(--text-muted); padding: 0 .15rem; border-radius: 3px; }
.record-btn:hover { background: var(--hover); color: inherit; }
.cell-text { display: block; max-width: 24rem; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
button.cell-text { background: none; border: none; padding: 0; margin: 0;
                   font: inherit; color: inherit; text-align: left; cursor: inherit; }
td.expandable .cell-text { cursor: zoom-in; }
.copy, .filter-eq { background: none; border: none; cursor: pointer; font: inherit;
        color: inherit; padding: 0 .15rem; border-radius: 3px; }
.copy:hover, .filter-eq:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
/* Overlays the cell's right edge on hover/focus instead of reserving
   padding in every cell. Opacity (not display) so the buttons stay
   focusable and the reveal is keyboard-reachable. */
.cell-actions { position: absolute; right: .25rem; top: 50%; transform: translateY(-50%);
                display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: canvas;
                box-shadow: 0 0 0 1px var(--border), 0 2px 6px #0002; opacity: 0; }
.cell-actions button { padding: .1rem .45rem; border-radius: 4px; }
td:hover .cell-actions, td:focus-within .cell-actions { opacity: 1; }
/* No hover on touch: keep the buttons visible, in reserved space. */
@media (hover: none) {
  td { padding-right: 4.5rem; }
  .cell-actions { opacity: 1; }
}
/* Fades out over 3s after a manual refresh; static under reduced motion,
   cleared by the next re-render (a fresh <tr> without the class). td has no
   background of its own, so the tr wash shows through. */
tbody tr.row-new { animation: row-new-fade 3s ease-out; }
@keyframes row-new-fade { from { background: var(--row-new-bg); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) {
  tbody tr.row-new { animation: none; background: var(--row-new-bg); }
}

/* ==== Controls / status ==== */
#toolbar { margin-top: var(--gap-xl); }
#filter-form { display: flex; gap: var(--gap); }
/* The wrap carries the field's look; the input's own text is transparent and
   #filter-hl, behind it, draws the coloured copy (features/filter-highlight.ts).
   The two must share font and padding exactly. */
#filter-wrap { position: relative; flex: 1; min-width: 12rem; display: flex;
               background: var(--surface); border-radius: 8px; }
#filter, #filter-hl { font-family: var(--font-mono); font-size: .8125rem; padding: .6rem .85rem;
                      box-sizing: border-box; }
#filter { flex: 1; min-width: 0; border: none; border-radius: 8px; background: transparent;
          color: transparent; caret-color: CanvasText; appearance: none; position: relative; }
#filter::placeholder { color: var(--text-muted); opacity: 1; }
#filter::selection { color: transparent; background: color-mix(in srgb, Highlight 40%, transparent); }
#filter-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
             display: flex; align-items: center; white-space: pre; }
#filter-wrap.plain #filter { color: inherit; }
#filter-wrap.plain #filter::selection { color: inherit; }
#filter-wrap.plain #filter-hl { display: none; }
.t-op { color: var(--text-muted); }
.t-keyword { color: var(--type-uuid); }
.t-value { color: var(--json-number); }
.t-err { text-decoration: underline wavy var(--danger); text-underline-offset: .2em; }
/* Forced colors repaint the input's text anyway, so the copy would double it. */
@media (forced-colors: active) {
  #filter { color: CanvasText; }
  #filter-hl { display: none; }
}
#apply { background: var(--chip-active-bg); color: var(--chip-active-fg); border: none;
         border-radius: 8px; padding: 0 1.1rem; font: inherit; cursor: pointer; }
/* Visually hidden but still in the accessibility tree — the aria-live
   loading text never occupies layout space. */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0;
           margin: -1px; overflow: hidden; clip-path: inset(50%);
           white-space: nowrap; border: 0; }
#error { color: var(--danger); margin-top: var(--gap); white-space: pre-wrap;
         font-family: var(--font-mono); font-size: .8rem; }
#error:empty { display: none; }
#meta { display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: var(--gap); margin-top: var(--gap); }
#meta-title { color: var(--text-muted); }
/* Data and identifiers stay monospace; the chrome around them is system-ui. */
.json-tree, dialog pre, dialog dl, .structure-row, button.refby-entry, #cv-pop button.cv-value,
#filter-suggest button { font-family: var(--font-mono); }
#current { font-family: var(--font-mono); color: CanvasText; }
#actions { display: flex; gap: 2px; }
#actions button, #pager button { background: none; border: none; font: inherit;
        font-size: .8125rem; color: var(--text-muted); padding: .25rem .5rem;
        border-radius: 6px; cursor: pointer; }
#actions button:hover:not(:disabled), #pager button:hover:not(:disabled) { background: var(--hover); color: inherit; }
#actions button:disabled, #pager button:disabled { opacity: .4; cursor: default; }
#protocol-warning { display: flex; justify-content: space-between; gap: var(--gap);
                    align-items: baseline; margin-top: var(--gap-lg); padding: .5rem .75rem;
                    border-radius: 8px;
                    background: color-mix(in srgb, var(--warning) 16%, transparent); }
#protocol-warning button { background: none; border: none; cursor: pointer; font: inherit;
                           color: inherit; padding: 0 .15rem; border-radius: 3px; }
#protocol-warning button:hover { background: var(--hover); }
.empty td { text-align: center; opacity: .6; padding: 1rem; }

/* Small uppercase heading inside dialogs and popovers. */
.section-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em;
               font-weight: 600; opacity: .6; margin: 0 0 var(--gap); display: block; }

/* ==== Other services (siblings) ==== */
.dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%;
       background: #999; flex: none; }
.dot.up { background: var(--success); } .dot.down { background: var(--danger); }
#siblings-btn { display: inline-flex; align-items: center; gap: .4rem; background: none;
                border: none; font: inherit; font-size: .8rem; color: var(--text-muted);
                padding: .25rem .5rem; border-radius: 6px; cursor: pointer;
                anchor-name: --siblings-anchor; }
#siblings-btn:hover { background: var(--hover); color: inherit; }
/* Same anchored-popover shape as #cv-pop, aligned to the button's right edge. */
#siblings-pop { position: fixed; position-anchor: --siblings-anchor;
          position-try-fallbacks: flip-block, flip-inline;
          inset: auto; top: calc(anchor(bottom) + .3rem); right: anchor(right);
          margin: 0; border: 1px solid var(--border-strong); border-radius: 12px;
          padding: .5rem; width: max-content; max-width: min(22rem, 90vw);
          box-shadow: 0 4px 16px #0004; }
#siblings-heading { margin: .1rem .6rem .5rem; font-size: .75rem; color: var(--text-muted); }
#siblings-list { display: flex; flex-direction: column; }
.sibling-row { display: flex; align-items: center; gap: .5rem; padding: .4rem .6rem;
               border-radius: 6px; color: inherit; text-decoration: none; }
.sibling-row:hover { background: var(--hover); }
/* Full name is in `title` (see loadSiblings()) as the truncation escape hatch. */
.sibling-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; font-family: var(--font-mono); }
.sibling-state { color: var(--text-muted); font-size: .75rem; }

/* ==== Pager ==== */
/* Sticky left, same reasoning as #chrome above: #content (and #pager's
   own position in normal flow) is only as wide as the table, so once a
   wide table pushes main's horizontal scrollbar out, an unpinned pager
   scrolls away with it instead of staying reachable. */
#pager { margin-top: var(--gap-lg); display: flex; gap: var(--gap); align-items: center;
         position: sticky; left: var(--gap-xl); width: fit-content; color: var(--text-muted); }

/* Native <dialog>: showModal() gives backdrop, Esc-to-close, and focus
   trapping for free. */
dialog { border: 1px solid var(--border-strong); border-radius: 8px; padding: 0;
         max-width: min(60rem, 92vw); max-height: 80vh; box-sizing: border-box; }
dialog::backdrop { background: var(--backdrop); }
.dialog-head { display: flex; justify-content: space-between; align-items: center;
               gap: 1rem; padding: var(--gap) var(--gap-lg); border-bottom: 1px solid var(--border); }
.dialog-head button { background: none; border: none; cursor: pointer;
                      font: inherit; color: inherit; }
/* border-box (here and on <dialog> above) keeps padding inside the
   max-height budget — content-box padding let long content overflow the
   dialog and add a second scrollbar around the pre's own. */
dialog pre, dialog dl { margin: 0; padding: var(--gap-lg); overflow: auto;
                        max-height: var(--dialog-body-max-h); box-sizing: border-box; }
dialog dl { display: grid; grid-template-columns: max-content 1fr max-content;
            gap: .3rem var(--gap-lg); }
dialog dl dt { font-weight: 600; }
dialog dl dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
/* A grid item, not absolutely positioned over a td, so it needs
   `position: static`; hover-to-reveal otherwise matches the table's
   copy button, keyed off dd:hover since dt/dd/button are flat grid
   siblings here. */
dialog dl .copy { position: static; top: auto; transform: none; opacity: 0; align-self: start; }
dialog dl dd:hover + .copy, dialog dl .copy:focus-visible { opacity: .7; }
dialog dl .copy:hover { opacity: 1; }
/* Lives in the dialog header, so it stays visible regardless of hover —
   a standalone action, not a per-field affordance. */
.dialog-head-title { display: flex; align-items: center; gap: .5rem; }
.dialog-head .copy { position: static; top: auto; transform: none; opacity: 1;
                     border: 1px solid var(--border); border-radius: 4px;
                     padding: .1rem .4rem; font-size: .85em; }
.copy-icon { display: inline-block; width: 1.2em; text-align: center; }

/* white-space: normal resets the pre-wrap inherited from ancestors
   (#cell-pop / dialog dl dd's plain-text case). */
.json-tree { white-space: normal; }
.json-line { display: flex; }
.json-children { margin-left: 1.05rem; border-left: 1px solid var(--border); padding-left: .5rem; }
.json-fold { all: unset; cursor: pointer; flex: none; width: 1rem; text-align: center;
             color: var(--border-strong); transform-origin: 45% 50%; }
.json-fold::before { content: "▾"; font-size: .65em; }
.json-node.collapsed > .json-line:first-child .json-fold { transform: rotate(-90deg); }
.json-node.collapsed > .json-children,
.json-node.collapsed > .json-line:last-child { display: none; }
.json-ellipsis { display: none; opacity: .7; }
.json-node.collapsed .json-ellipsis { display: inline; }
.json-punct { color: var(--border-strong); }
.json-key { font-weight: 600; }
.json-string { color: var(--json-string); }
.json-number { color: var(--json-number); }
.json-bool { color: var(--json-bool); }
.json-null { color: var(--json-null); }
.json-uuid { color: var(--type-uuid); }
.cell-type-uuid { color: var(--type-uuid); }
.cell-type-bool { color: var(--type-bool); }
.cell-type-number { color: var(--type-number); }
.cell-type-date { color: var(--type-date); }

/* Icon buttons in the top bar. */
#api-help-btn, #theme-toggle { flex: none; width: 1.75rem; height: 1.75rem; border-radius: 6px; padding: 0;
                border: none; background: none; color: var(--text-muted); cursor: pointer; font: inherit; line-height: 1; }
#api-help-btn:hover, #theme-toggle:hover { background: var(--hover); color: inherit; }
/* Icon is pure CSS, no JS: it's driven by the same cascade the
   color-scheme rules above use (system prefers-color-scheme by default,
   overridden by an explicit :root[data-theme]), so it always reflects
   the theme actually in effect without a matchMedia listener. */
#theme-toggle::before { content: "☀️"; }
@media (prefers-color-scheme: dark) {
  #theme-toggle::before { content: "🌙"; }
}
:root[data-theme="light"] #theme-toggle::before { content: "☀️"; }
:root[data-theme="dark"] #theme-toggle::before { content: "🌙"; }

/* Popover API: non-modal, light-dismiss. Positioned via CSS Anchor
   Positioning — the clicked cell gets anchor-name set in JS, and
   position-try-fallbacks flips it away from the viewport edge with no
   clamping math. Unsupported browsers fall back to default placement,
   not breakage. */
/* width:max-content sidesteps a Firefox shrink-to-fit quirk: with only
   max-width set, Firefox sizes the popover from min-content rather than
   available space, and break-word's min-content is a single character —
   collapsing the box to a one-letter-wide column. Sizing to max-content
   (still clamped by max-width) fixes that without capping width. */
#cell-pop { position: fixed; position-anchor: --cell-anchor;
            position-try-fallbacks: flip-block, flip-inline;
            inset: auto; top: calc(anchor(bottom) + .3rem); left: anchor(left);
            margin: 0; border: 1px solid var(--border-strong);
            border-radius: 8px; padding: 0; width: max-content;
            max-width: min(40rem, 90vw);
            box-shadow: 0 4px 16px #0004; }
#cell-pop pre, #cell-pop .json-tree { margin: 0; padding: .6rem var(--gap-lg); overflow: auto;
                max-height: 50vh; word-break: break-word; }
#cell-pop pre { white-space: pre-wrap; }

/* Same shape as #cell-pop, anchored to the header's ▾ button. Separate
   anchor-name (--cv-anchor): both popovers can be open from the same
   render pass and each anchor-name resolves to one element. */
#cv-pop { position: fixed; position-anchor: --cv-anchor;
          position-try-fallbacks: flip-block, flip-inline;
          inset: auto; top: calc(anchor(bottom) + .3rem); left: anchor(left);
          margin: 0; border: 1px solid var(--border-strong);

// src/features/api-reference.ts
function buildApiReference() {

$("api-help-btn").onclick = () => {

};
