# go:* — Go/net-http port (implementations/go-nethttp).

["go:build"]
description = "go build ./..."
run = "go build ./..."
dir = "implementations/go-nethttp"

["go:vet"]
description = "go vet ./..., with the sqlite and mysql build tags so their test files are vetted too"
run = "go vet -tags sqlite,mysql ./..."
dir = "implementations/go-nethttp"

["go:fmt"]
description = "gofmt -w ."
run = "gofmt -w ."
dir = "implementations/go-nethttp"

["go:fmt-check"]
description = "gofmt -l . (fails if any file needs reformatting)"
run = "sh tools/check-go-fmt.sh"

["go:test"]
description = "go test -race with the sqlite and mysql build tags (integration_test.go needs DATABASE_URL + the conformance seed; mysql tests skip without MYSQL_TEST_URL)"
run = "go test -race -tags sqlite,mysql ./..."
dir = "implementations/go-nethttp"

["go:demo"]
description = "run the demo host app at http://localhost:4000/__ashurbanipal"
run = "go run ./cmd/demo"
dir = "implementations/go-nethttp"
sources = ["*.go", "cmd/demo/**/*.go", "frontend/dbviewer.html"]

["go:dev"]
description = "run the demo host app, auto-rebuilding and restarting on implementations/go-nethttp/{*.go,cmd/demo} or frontend/dbviewer.html changes"
run = "mise watch go:demo --restart"
