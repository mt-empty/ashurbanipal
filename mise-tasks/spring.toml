# spring:* — Kotlin/Spring Boot starter (implementations/spring-boot-starter),
# built with Gradle. Demo runs on port 4100, not 4000.

["spring:build"]
description = "gradle assemble (compile + jar, no tests)"
run = "./gradlew assemble"
dir = "implementations/spring-boot-starter"

["spring:test"]
description = "gradle test"
run = "./gradlew test"
dir = "implementations/spring-boot-starter"

# One Gradle invocation, matching the CI step (_spring-build-test.yml).
# `./gradlew build` compiles, assembles, and runs the tests in a single
# daemon; fanning out to parallel spring:build + spring:test tasks made two
# clients race on one Kotlin incremental-compile cache, corrupting it under
# `mise run check` load.
["spring:check"]
description = "gradle build (compile + assemble + test, single invocation)"
run = "./gradlew build"
dir = "implementations/spring-boot-starter"

["spring:demo"]
description = "host demo app at http://localhost:4100/__ashurbanipal"
run = "./gradlew :demo:bootRun"
dir = "implementations/spring-boot-starter"
# Host is "db", matching DATABASE_URL's host in the devcontainer (set in
# .devcontainer/devcontainer.json) — Spring's demo module takes its own
# JDBC-shaped datasource vars instead of parsing DATABASE_URL.
env = { SPRING_DATASOURCE_URL = "jdbc:postgresql://db:5432/ashurbanipal", SPRING_DATASOURCE_USERNAME = "ashurbanipal", SPRING_DATASOURCE_PASSWORD = "ashurbanipal", ASHURBANIPAL_ENABLED = "true" }
sources = ["src/main/kotlin/**/*.kt", "demo/src/**/*", "../../frontend/dbviewer.html"]

["spring:dev"]
description = "run the demo host app, auto-restarting on implementations/spring-boot-starter/{src,demo} or frontend/dbviewer.html changes"
run = "mise watch spring:demo --restart"
