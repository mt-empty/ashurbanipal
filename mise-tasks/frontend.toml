# frontend:* — the single self-contained frontend/dbviewer.html, generated from
# frontend/src/ and vendored into each port.

["frontend:install"]
description = "pnpm install --frozen-lockfile"
hide = true
run = "pnpm install --frozen-lockfile"
dir = "frontend"

["frontend:build"]
description = "bundle frontend/src/ into frontend/dbviewer.html, then regenerate the docs/demo/index.html GitHub Pages demo from it"
run = "node build.mjs && node build-demo.mjs"
dir = "frontend"
depends = ["frontend:install"]
# Skip the esbuild re-bundle when nothing it reads has changed. Only the two
# bundlers get this — test/lint/*-check tasks stay unconditional so a stale
# marker can never mask a real failure.
sources = ["src/**/*", "build.mjs", "build-demo.mjs", "bundle-options.mjs", "package.json", "pnpm-lock.yaml", "tsconfig.json"]
outputs = ["dbviewer.html", "../docs/demo/index.html"]

["frontend:typecheck"]
description = "tsc --noEmit over frontend/src/ (DOM libs) and frontend/test/ (node types)"
run = ["pnpm exec tsc --noEmit", "pnpm exec tsc --noEmit -p tsconfig.test.json"]
dir = "frontend"
depends = ["frontend:install"]

["frontend:test-unit"]
description = "node --test over frontend/test/ — pure-logic units (the DSL parser); no browser"
run = "pnpm run test"
dir = "frontend"
depends = ["frontend:install"]

["frontend:lint"]
description = "biome check over frontend/src/ (format + recommended lint; see frontend/biome.json)"
run = "pnpm run lint"
dir = "frontend"
depends = ["frontend:install"]

["frontend:check-cycles"]
description = "fail if frontend/src/ has any value-import cycle (docs/frontend-style-guide.md §1)"
run = "sh tools/check-frontend-cycles.sh"

["frontend:check-api-reference"]
description = "fail if the filter operator list / limits drift between spec/openapi.yaml and frontend/src/"
run = "sh tools/check-frontend-api-reference.sh"

["frontend:build-check"]
description = "verify frontend/dbviewer.html is what frontend/src/ currently builds to"
run = "sh tools/check-frontend-build.sh"
depends = ["frontend:install"]

["frontend:build-demo"]
description = "bundle a synthetic in-browser demo (fake data, no backend) into docs/demo/index.html for GitHub Pages — runs automatically as part of frontend:build; this is for explicit standalone use"
run = "node build-demo.mjs"
dir = "frontend"
depends = ["frontend:build"]

["frontend:build-demo-check"]
description = "verify docs/demo/index.html is what frontend/src/ + dbviewer.html currently builds to"
run = "sh tools/check-frontend-build-demo.sh"
depends = ["frontend:build"]

["frontend:sync-ports"]
description = "sync the canonical frontend and re-pin its Rust, Go, Spring, Node, and Flask consumers"
run = "tools/sync-ports-frontend.sh"

["frontend:check-ports-sync"]
description = "verify vendored frontend copies and pins match frontend/dbviewer.html"
run = "tools/sync-ports-frontend.sh --check"

["frontend:test-e2e-install"]
description = "one-time Playwright browser install (Chromium, Firefox, WebKit) for the e2e suite"
usage = 'flag "--browsers <list>" default="chromium,firefox,webkit" help="comma-separated browsers to install"'
run = 'pnpm install && pnpm exec playwright install --with-deps $(echo "${usage_browsers}" | tr , " ")'
dir = "tools/e2e-tests"

# Serves axum's vendored dbviewer.html, so run frontend:sync-ports after a build first.
# --browsers, not a shell E2E_BROWSERS, picks the browsers, so a value left in the shell can't drop one.
["frontend:test-e2e"]
description = "run the full three-browser Playwright e2e suite against axum's vendored dbviewer.html"
usage = '''
flag "--browsers <list>" default="chromium,firefox,webkit" help="comma-separated browsers; CI runs one per shard"
arg "[args]..." help="passed on to playwright test, e.g. --last-failed or -g title" var=#true
'''
run = 'E2E_BROWSERS="${usage_browsers}" PLAYWRIGHT_HTML_OPEN=never pnpm exec playwright test --reporter=line,html {{arg(name="args", var=true, default="")}}'
dir = "tools/e2e-tests"

["frontend:test-e2e-quick"]
description = "rebuild and sync the frontend, then run the whole Playwright e2e suite on Chromium and Firefox only"
run = "E2E_BROWSERS=chromium,firefox pnpm exec playwright test --reporter=line"
dir = "tools/e2e-tests"
depends = ["frontend:rebuild"]

["frontend:test-e2e-spec"]
description = "rebuild and sync the frontend, then run one Playwright spec on Chromium and Firefox only: mise run frontend:test-e2e-spec tests/<name>.spec.ts [-g title]"
run = "E2E_BROWSERS=chromium,firefox pnpm exec playwright test --reporter=line"
dir = "tools/e2e-tests"
depends = ["frontend:rebuild"]

# The report is written even when a test fails; the task still exits with the tests' status.
["frontend:test-e2e-coverage"]
description = "rebuild and sync the frontend, run the e2e suite on Chromium with JS coverage, and report line/branch/function coverage per frontend/src file (coverage-results/report/index.html)"
usage = 'arg "[args]..." help="passed on to playwright test, e.g. a spec path or -g title" var=#true'
run = '''
rm -rf coverage-results
node coverage/build-map.mjs
status=0
E2E_COVERAGE=1 E2E_BROWSERS=chromium pnpm exec playwright test --reporter=line {{arg(name="args", var=true, default="")}} || status=$?
node coverage/report.mjs
exit $status
'''
dir = "tools/e2e-tests"
depends = ["frontend:rebuild"]

["frontend:showcase"]
description = "record a scripted dark-theme walkthrough of dbviewer.html and encode it to a Bayer-dithered tools/e2e-tests/showcase.gif"
run = "./generate-showcase-gif.sh"
dir = "tools/e2e-tests"

# A task's `depends` run in parallel, so the sync is this task's run, after the build.
["frontend:rebuild"]
description = "frontend:build, then frontend:sync-ports"
run = "mise run frontend:sync-ports"
depends = ["frontend:build"]

["frontend:watch"]
description = "rebuild and re-sync every port's vendored page whenever frontend/src/ changes"
run = "mise watch -w frontend/src frontend:rebuild"

# Port 4002 clears rust:dev (4000) and rust:demo-sibling (4001); a task's `env` never reaches its
# `depends`, so the port is set on the command that starts both.
["frontend:dev"]
description = "edit frontend/src/ live: rebuild + sync on change, with the Node demo restarting at http://localhost:4002/__ashurbanipal"
run = "PORT=4002 mise run frontend:watch ::: node:dev"
