# actix:* — the second Rust framework adapter (implementations/rust/actix-web),
# reusing core/. No actix:fmt-check/lint/test — rust:fmt-check/rust:lint/
# rust:test already run bare (no -p/--workspace) from the virtual workspace
# root (implementations/rust/Cargo.toml) and reach every member — axum, core,
# and this crate — since Cargo defaults to all members there with no explicit
# default-members needed. Only the demo binary is genuinely per-crate.

["actix:demo"]
description = "run the actix-web demo host app at http://localhost:4000/__ashurbanipal"
run = "cargo run -p ashurbanipal-actix-web --example demo"
dir = "implementations/rust/actix-web"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

["actix:demo-sibling"]
description = "run a second actix-web demo instance on 4001, sibling-polling the one on 4000"
run = "cargo run -p ashurbanipal-actix-web --example demo"
env = { PORT = "4001", SIBLING_PORT = "4000" }
dir = "implementations/rust/actix-web"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

["actix:dev"]
description = "run the actix-web demo host app, auto-rebuilding and restarting on src/ or dbviewer.html changes"
run = "mise watch actix:demo --restart"
