# rust:* — three-crate Cargo workspace at implementations/rust (core + axum +
# actix-web). fmt-check/lint/test/fmt run bare from the workspace root and
# reach every member; only the demo binaries are per-crate.

["rust:build"]
description = "cargo build"
run = "cargo build"
dir = "implementations/rust"

["rust:test"]
description = "cargo test --lib: the crate's own inline unit tests (pass a path to run one test, e.g. `mise run rust:test config::tests::name`)"
# --lib excludes the `[[test]] name = "conformance"` integration target
# (Cargo.toml) — plain `cargo test` picks that up too, which would run the
# same spawn-heavy conformance suite conformance:test already owns, a second
# time, concurrently with it (check's rust and conformance deps run in
# parallel). Doubling up that suite doubles concurrent spawned `demo`
# processes and DB connections and has surfaced as spurious
# connection-reset/incomplete-response failures under CI resource pressure,
# not a logic bug.
run = "cargo test --lib"
dir = "implementations/rust"

["rust:test-sqlite"]
description = "cargo test --lib --features sqlite: the sqlite-feature inline unit tests (core/src/db/sqlite.rs; sqlite::memory:, no service)"
run = "cargo test --lib --features sqlite"
dir = "implementations/rust"

["rust:test-mysql"]
description = "cargo test --lib --features mysql: the mysql-feature inline unit tests (core/src/db/mysql.rs; needs MYSQL_TEST_URL, MARIADB_TEST_URL)"
run = "cargo test --lib --features mysql"
dir = "implementations/rust"

["rust:integration-test"]
description = "cargo test --test schema_isolation --test multi_source --test table_listing_privileges: axum's own Postgres-backed integration tests (needs DATABASE_URL)"
# Separate from rust:test (--lib) for the same reason that task excludes
# the conformance target: these open their own DB pools and would add
# concurrent connection pressure if run alongside conformance:test.
# Excludes schema_isolation_mysql.rs on purpose — that file requires the
# mysql feature + MYSQL_TEST_URL and documents itself as not run in CI
# (see its own module doc comment), same as the rest of the mysql feature.
run = "cargo test --test schema_isolation --test multi_source --test table_listing_privileges"
dir = "implementations/rust/axum"

["rust:integration-test-actix"]
description = "cargo test --test multi_source: actix-web's own Postgres-backed integration tests (needs DATABASE_URL)"
# No schema_isolation.rs equivalent here — that tests core::PgPoolSource
# directly, already covered once via axum's copy.
run = "cargo test --test multi_source"
dir = "implementations/rust/actix-web"

["rust:integration-test-mysql"]
description = "cargo test --features mysql --test schema_isolation_mysql --test table_listing_privileges_mysql: axum's MySQL/MariaDB integration tests (needs MYSQL_TEST_URL, MARIADB_TEST_URL)"
run = "cargo test --features mysql --test schema_isolation_mysql --test table_listing_privileges_mysql"
dir = "implementations/rust/axum"

["rust:integration-test-sqlite"]
description = "cargo test --features sqlite --test multi_source_sqlite: axum's SQLite router-level integration test (in-memory, no service)"
run = "cargo test --features sqlite --test multi_source_sqlite"
dir = "implementations/rust/axum"

["rust:lint"]
description = "cargo clippy, denying warnings"
run = "cargo clippy -- -D warnings"
dir = "implementations/rust"

["rust:lint-all-features"]
description = "cargo clippy --features sqlite,mysql, denying warnings: covers the sqlite/mysql DbSource impls the default lint never compiles"
run = "cargo clippy --features sqlite,mysql -- -D warnings"
dir = "implementations/rust"

["rust:fmt"]
description = "cargo fmt"
run = "cargo fmt"
dir = "implementations/rust"

["rust:fmt-check"]
description = "cargo fmt --check"
run = "cargo fmt --check"
dir = "implementations/rust"

["rust:demo"]
description = "run the demo host app at http://localhost:4000/__ashurbanipal"
run = "cargo run -p ashurbanipal-axum --example demo"
dir = "implementations/rust/axum"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

["rust:demo-sibling"]
description = "run a second demo instance on 4001, sibling-polling the one on 4000"
run = "cargo run -p ashurbanipal-axum --example demo"
env = { PORT = "4001", SIBLING_PORT = "4000" }
dir = "implementations/rust/axum"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

["rust:dev"]
description = "run the demo host app, auto-rebuilding and restarting on src/ or dbviewer.html changes"
run = "mise watch rust:demo --restart"
