# changelog:* — one implementations/<port>/CHANGELOG.md per published port. The
# 0.3.0 floor is hand-written; git-cliff only ever generates > 0.3.0.
# `changelog:<port>` prints the not-yet-released section — at release time
# paste it under a new `## [X.Y.Z]` heading (docs/publishing-checklist.md).
# The publish workflow takes that committed `## [X.Y.Z]` section verbatim as the
# GitHub Release body, and its verify job refuses to publish without it
# (_post-release.yml, _rust-crate-publish-check.yml).

["changelog:check"]
description = "verify each implementations/<port>/CHANGELOG.md top section matches that port's manifest version (offline; no git-cliff)"
hide = true
run = "tools/check-changelogs.sh"

["changelog:rust-core"]
description = "print the unreleased CHANGELOG section for the ashurbanipal core crate"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-v' --include-path 'implementations/rust/core/**' 'spec/**'"

["changelog:rust-axum"]
description = "print the unreleased CHANGELOG section for ashurbanipal-axum"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-axum-v' --include-path 'implementations/rust/axum/**' 'implementations/rust/core/**' 'frontend/**' 'spec/**'"

["changelog:rust-actix-web"]
description = "print the unreleased CHANGELOG section for ashurbanipal-actix-web"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-actix-web-v' --include-path 'implementations/rust/actix-web/**' 'implementations/rust/core/**' 'frontend/**' 'spec/**'"

