# Machine-readable companion to spec/protocol.md (which is normative where
# they disagree). Shapes derived from the Rust implementation's
# serialization (implementations/rust/axum/src/routes.rs,
# implementations/rust/core/src/db/); identical across the Postgres,
# MySQL, and SQLite backends.
openapi: 3.1.0
info:
  title: Ashurbanipal Protocol
  version: "1"
  description: >
    Read-only SQL table-browsing API (Postgres, MySQL, or SQLite
    backend). Paths are relative to
    {mount}/api, where {mount} is the implementation-defined mount point
    (reference default: /__ashurbanipal). The UI itself is served at
    {mount} as text/html and is not described here.

servers:
  - url: "{mount}/api"
    variables:
      mount:
        default: /__ashurbanipal
        description: Implementation-defined mount point.

paths:
  /sources:
    get:
      operationId: listSources
      summary: List source names selectable as the `source` param elsewhere.
      responses:
        "200":
          description: >
            Live allow-list for the `source` param on /schemas, /tables,
            /table-counts, /tables/data, /tables/common-values,
            /tables/referenced-by, and /tables/structure
            (spec/protocol.md §5.8). Exactly one
            entry for a single-source deployment.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /schemas:
    get:
      operationId: listSchemas
      summary: List schema names selectable as the `schema` param elsewhere.
      parameters:
        - $ref: "#/components/parameters/Source"
      responses:
        "200":
          description: >
            Live allow-list for the `schema` param on /tables,
            /table-counts, /tables/data, /tables/common-values,
            /tables/referenced-by, and /tables/structure
            (spec/protocol.md §5.7).
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemasResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /tables:
    get:
      operationId: listTables
      summary: List base tables of the resolved schema.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
      responses:
        "200":
          description: Table list (also the allow-list for `table` params).
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/TableInfo"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /table-counts:
    get:
      operationId: tableCounts
      summary: Approximate row counts from pg_class.reltuples.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
      responses:
        "200":
          description: Approximate counts for every table.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountsResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /tables/data:
    get:
      operationId: tableData
      summary: Paginated, filtered, sorted rows for a single table.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
        - name: table
          in: query
          required: true
          description: >
            Must exactly match (case-sensitive) a table name from /tables;
            otherwise 400.
          schema:
            type: string
          examples:
            # Three named cases, sourced from conformance/seed/seed.sql, so
            # the Examples phase actually exercises distinct 200-response
            # shapes rather than only ever hitting `orders`: a plain table,
            # one with a composite PK/FK pair (composite-key omission from
            # column metadata, spec/protocol.md §5.4.1), and one deliberately
            # left un-ANALYZEd (total_approx == -1, spec/protocol.md §5.4.4).
            orders:
              value: orders
            inventory_counts:
              value: inventory_counts
            feature_flags:
              value: feature_flags
        - name: filter
          in: query
          required: false
          description: >
            URL-encoded JSON array of condition objects (the filter AST —
            never DSL text; DSL parsing is frontend-only, see
            spec/filter-dsl.md). `logic` is absent on the first element and
            required on every subsequent one; `value` is present iff `op`
            is not IS NULL / IS NOT NULL; at most 10 conditions; the
            encoded size is bounded (see spec/protocol.md §5.4.2). An
            empty array means no filter. Structural violations and unknown
            columns yield 400.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/FilterCondition"
              examples:
                # Keyed to match the `orders` case above so a combined
                # example request stays internally consistent (a real
                # column of that table).
                orders:
                  value:
                    - column: status
                      op: "="
                      value: completed
        - name: limit
          in: query
          required: false
          description: >
            Clamped to [1, max_page_size] (reference default max 100),
            never an error — including negative or out-of-range values.
            Default is default_page_size (reference 50). Deliberately no
            `minimum`/`maximum` on the schema below: those are JSON Schema
            *rejection* constraints, and this field is never rejected for
            being out of range, only clamped — declaring bounds here would
            claim behavior the API doesn't have.
          schema:
            type: integer
          example: 10
        - name: offset
          in: query
          required: false
          description: >
            Clamped to a minimum of 0, never an error — including negative
            or out-of-range values, same treatment as `limit`. No
            `minimum` on the schema below for the same reason as `limit`:
            it's a JSON Schema rejection constraint, and this field is
            never rejected for being out of range.
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          description: >
            Single column name, validated against the table's real
            columns; unknown column yields 400. Ordering uses the
            column's native type ordering.
          schema:
            type: string
          examples:
            orders:
              value: created_at
        - name: order
          in: query
          required: false
          description: Any value other than asc/desc yields 400.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: One page of rows plus column metadata.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDataResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /tables/common-values:
    get:
      operationId: commonValues
      summary: Most-common values for one column, from pg_stats.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
        - name: table
          in: query
          required: true
          schema:
            type: string
          examples:
            # `feature_flags` is deliberately excluded from the seed's
            # ANALYZE pass (conformance/seed/README.md), so this pair
            # exercises the empty-values-not-an-error path
            # (spec/protocol.md §5.5) alongside the ordinary populated one.
            orders:
              value: orders
            feature_flags:
              value: feature_flags
        - name: column
          in: query
          required: true
          schema:
            type: string
          examples:
            orders:
              value: status
            feature_flags:
              value: enabled
      responses:
        "200":
          description: >
            Most-common values, most frequent first. Empty when the column
            has no planner statistics (never an error).
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonValuesResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /tables/referenced-by:
    get:
      operationId: referencedBy
      summary: Foreign keys elsewhere in the schema that target this table.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
        - name: table
          in: query
          required: true
          description: >
            Must exactly match (case-sensitive) a table name from /tables;
            otherwise 400.
          schema:
            type: string
          examples:
            # Three named cases from conformance/seed/seed.sql exercising
            # distinct 200 shapes (spec/protocol.md §5.9): a multi-referrer
            # target (users — two of the entries share a referencing
            # table), a composite-FK target (inventory_locations — one
            # entry whose `columns` has two pairs), and a target nothing
            # references (feature_flags — `referenced_by` is []).
            users:
              value: users
            inventory_locations:
              value: inventory_locations
            feature_flags:
              value: feature_flags
      responses:
        "200":
          description: >
            One entry per foreign-key constraint pointing at `table`;
            `referenced_by` is [] when nothing does (not an error).
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferencedByResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /tables/structure:
    get:
      operationId: tableStructure
      summary: Indexes and constraints of one table.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
        - name: table
          in: query
          required: true
          description: >
            Must exactly match (case-sensitive) a table name from /tables;
            otherwise 400.
          schema:
            type: string
          examples:
            # Named cases from conformance/seed/seed.sql (spec/protocol.md
            # §5.10): a table with unique, FK, check and partial/expression
            # indexes (orders, users), and a composite-FK table
            # (inventory_counts).
            orders:
              value: orders
            users:
              value: users
            inventory_counts:
              value: inventory_counts
      responses:
        "200":
          description: >
            The table's indexes and constraints. A table with no structure
            returns empty lists, not an error.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructureResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /tables/join:
    get:
      operationId: tableJoin
      summary: Paginated, filtered, sorted rows from joined tables.
      description: >
        Joins up to 4 tables of one schema with INNER or LEFT joins on
        column equality, described as a structure (spec/protocol.md
        §5.11). No SQL text is accepted. The response has no total.
      parameters:
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Schema"
        - name: join
          in: query
          required: true
          description: >
            URL-encoded JSON object (spec/protocol.md §5.11.1). Tables are
            referenced by position: 0 is the base table, 1..n the entries
            of `joins`. At most 4 tables, 1 to 3 `on` pairs per join, and
            the encoded size is bounded. Unknown names, an incompatible
            column pair, or a malformed object yield 400 `invalid_join`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"
              examples:
                orders_users:
                  value:
                    table: orders
                    joins:
                      - type: left
                        table: users
                        on:
                          - left: {join: 0, column: user_id}
                            right: id
        - name: filter
          in: query
          required: false
          description: >
            As /tables/data, plus an optional `join` position per
            condition (default 0). Out-of-range position or unknown
            column yields 400.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/JoinFilterCondition"
        - name: sort
          in: query
          required: false
          description: >
            Column name of the table at `sort_join`; unknown column yields
            400. Ordering uses the column's native type ordering.
          schema:
            type: string
        - name: sort_join
          in: query
          required: false
          description: >
            Table position of the `sort` column, default 0. Present
            without `sort`, or out of range, yields 400.
          schema:
            type: integer
            minimum: 0
        - name: order
          in: query
          required: false
          description: Any value other than asc/desc yields 400.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          required: false
          description: >
            Clamped to [1, max_page_size], never an error, as on
            /tables/data. No `minimum`/`maximum` on the schema for the same
            reason.
          schema:
            type: integer
          example: 10
        - name: offset
          in: query
          required: false
          description: >
            Clamped to a minimum of 0, never an error, as on /tables/data.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: >
            One page of joined rows plus column metadata. `has_more` says
            whether a following row exists; there is no total.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/ServerError"

  /siblings:
    get:
      operationId: siblings
      summary: Configured sibling services with live health status.
      responses:
        "200":
          description: >
            One entry per configured sibling, health-checked per request
            except this instance's own entry. Empty configuration yields
            an empty list.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiblingsResponse"
        "500":
          description: >
            The sibling configuration is invalid (`code: invalid_config`);
            `title` names the broken rule. Every other route still serves.
          headers:
            x-ashurbanipal-protocol:
              $ref: "#/components/headers/ProtocolVersion"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  parameters:
    Source:
      name: source
      in: query
      required: false
      description: >
        Selects which registered DbSource this operation targets
        (spec/protocol.md §1). Absent resolves to the first-registered
        source. Present must exactly match (case-sensitive) an entry
        from GET /sources; otherwise 400.
      schema:
        type: string

    Schema:
      name: schema
      in: query
      required: false
      description: >
        Selects which schema this operation is scoped to (spec/protocol.md
        §1). Absent resolves to the connection's own default. Present
        must exactly match (case-sensitive) an entry from GET /schemas;
        otherwise 400.
      schema:
        type: string

  headers:
    ProtocolVersion:
      description: Protocol version; "1" for this document.
      required: true
      schema:
        type: string
        const: "1"
    NoSniff:
      description: >
        Always "nosniff", so a browser never renders request text echoed in
        a body as HTML (spec/protocol.md §2).
      required: true
      schema:
        type: string
        const: nosniff

  responses:
    ClientError:
      description: >
        Client error — unknown source/schema/table/column, invalid
        filter, invalid parameter, or a table the role can't read.
      headers:
        x-ashurbanipal-protocol:
          $ref: "#/components/headers/ProtocolVersion"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServerError:
      description: Server error — database failure or query timeout.
      headers:
        x-ashurbanipal-protocol:
          $ref: "#/components/headers/ProtocolVersion"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    SourceEntry:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >
            Opaque, implementation-defined identifier. No other field is
            defined — a source's backend engine has no wire
            representation, it's a host-side configuration detail only.

    SourcesResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceEntry"
          description: >
            Selectable sources, in the same order the `source` param's
            absent case resolves against (first entry is the default).
            Exactly one entry for a single-source deployment.

    SchemasResponse:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            type: string
          description: >
            Selectable schema names, excluding the engine's own
            system/internal namespaces. Exactly one entry on engines with
            no schema concept above a single database.

    TableInfo:
      type: object
      required: [name]
      properties:
        name:
          type: string
        comment:
          type: string
          description: COMMENT ON TABLE text; omitted (never null) when absent.

    ColumnInfo:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description: >
            The column's type name as the backing engine's own catalog
            reports it (Postgres information_schema.columns.data_type;
            MySQL information_schema.COLUMNS.DATA_TYPE; SQLite the declared
            type, or "unknown" when none). Informational only — never used
            to build SQL.
        key:
          type: string
          enum: [pk, fk]
          description: >
            Omitted for non-key columns and for members of composite
            foreign keys (composite FKs are omitted entirely).
        references:
          type: object
          description: >
            Present whenever the column is a foreign key, independent of
            what key reports — including alongside key: pk for a column
            that is both its table's primary key and a foreign key.
          required: [table, column]
          properties:
            table:
              type: string
            column:
              type: string
            schema:
              type: string
              description: >
                Present only when the referenced table lives in a schema
                other than the referencing column's own (a cross-schema
                FK); omitted for the common same-schema case.
        comment:
          type: string
          description: COMMENT ON COLUMN text; omitted when absent.

    TableDataResponse:
      type: object
      required: [columns, rows, total_approx]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnInfo"
        rows:
          type: array
          description: >
            One object per row, keyed by column name. Every value is a
            JSON string (the engine's own text rendering — uuids, numbers,
            timestamps, JSON all serialize as strings) or null for SQL
            NULL; an undecodable value is the sentinel string
            "<undecodable>". Native JSON numbers/booleans are
            non-conformant.
          items:
            type: object
            additionalProperties:
              type: ["string", "null"]
        total_approx:
          type: integer
          format: int64
          description: >
            Whole-table pg_class.reltuples estimate; unaffected by
            filter; may be stale or -1 before first ANALYZE.

    CountsResponse:
      type: object
      required: [counts]
      properties:
        counts:
          type: array
          items:
            type: object
            required: [table, approx_rows]
            properties:
              table:
                type: string
              approx_rows:
                type: integer
                format: int64
                description: May be stale or -1 before first ANALYZE.

    CommonValuesResponse:
      type: object
      required: [values]
      properties:
        values:
          type: array
          description: Most frequent first; empty when no planner statistics.
          items:
            type: object
            required: [value, freq]
            properties:
              value:
                type: string
                description: >
                  Rendered consistently with row serialization (e.g.
                  booleans as "true"/"false").
              freq:
                type: number
                format: float
                description: Fraction of rows, in (0, 1].

    ReferencedByResponse:
      type: object
      required: [referenced_by]
      properties:
        referenced_by:
          type: array
          description: >
            One object per foreign-key constraint whose referenced table
            is the requested `table` (spec/protocol.md §5.9). A referencing
            table with two FKs to the target appears twice. Empty array
            when nothing references the target. SHOULD be ordered by
            (schema, table, constraint).
          items:
            type: object
            required: [table, constraint, columns]
            properties:
              table:
                type: string
                description: The referencing table (holds the FK). Bare name.
              schema:
                type: string
                description: >
                  The referencing table's schema; present only when it
                  differs from the resolved schema (a cross-schema
                  reference). This is the opposite end of the relationship
                  from ColumnInfo.references.schema.
              constraint:
                type: string
                description: >
                  FK constraint name; (table, constraint) is unique within
                  one response. MAY be a synthesized label on engines that
                  don't name FK constraints (e.g. SQLite) — not a DDL
                  identifier, not guaranteed stable.
              columns:
                type: array
                description: >
                  Column pairing, one entry per column in the constraint,
                  in the constraint's own order. More than one entry for a
                  composite FK (included here, unlike §5.4.1's per-column
                  metadata).
                items:
                  $ref: "#/components/schemas/ColumnPair"

    ColumnPair:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Column on the table that holds the foreign key.
        to:
          type: string
          description: Referenced column on the target table.

    StructureResponse:
      type: object
      required: [indexes, constraints]
      description: >
        Indexes and constraints of one table (spec/protocol.md §5.10).
      properties:
        indexes:
          type: array
          description: >
            Every index on the table, including those backing a primary key
            or unique constraint. [] when there are none. A partition
            child reports its own.
          items:
            type: object
            required: [name, columns, unique, method]
            properties:
              name:
                type: string
              columns:
                type: array
                description: >
                  Key columns in index order. An expression entry appears
                  in its position as its expression text. INCLUDE columns
                  are not listed.
                items:
                  type: string
              unique:
                type: boolean
              method:
                type: string
                description: Engine access-method name, e.g. btree.
              predicate:
                type: string
                description: >
                  Partial-index WHERE text. Omitted for a non-partial index
                  and on engines with no partial indexes.
        constraints:
          type: object
          required: [unique, foreign_keys, check]
          properties:
            primary_key:
              type: object
              description: Omitted when the table has no primary key.
              required: [columns]
              properties:
                name:
                  type: string
                  description: Omitted when the engine reports none.
                columns:
                  type: array
                  items:
                    type: string
            unique:
              type: array
              items:
                type: object
                required: [name, columns]
                properties:
                  name:
                    type: string
                  columns:
                    type: array
                    items:
                      type: string
            foreign_keys:
              type: array
              description: >
                Outgoing foreign keys, single-column and composite alike.
              items:
                type: object
                required: [name, table, columns, on_delete, on_update]
                properties:
                  name:
                    type: string
                    description: >
                      MAY be a synthesized label on engines that don't name
                      FK constraints (e.g. SQLite) — not a DDL identifier,
                      not guaranteed stable.
                  table:
                    type: string
                    description: The referenced table.
                  schema:
                    type: string
                    description: >
                      The referenced table's schema; present only when it
                      differs from the resolved schema.
                  columns:
                    type: array
                    items:
                      $ref: "#/components/schemas/ColumnPair"
                  on_delete:
                    $ref: "#/components/schemas/ForeignKeyAction"
                  on_update:
                    $ref: "#/components/schemas/ForeignKeyAction"
            check:
              type: array
              description: >
                [] on an engine that cannot introspect check constraints
                (SQLite).
              items:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                  expression:
                    type: string
                    description: >
                      The constraint's SQL text; omitted where the engine
                      cannot supply it.

    ForeignKeyAction:
      type: string
      enum: [CASCADE, RESTRICT, SET NULL, SET DEFAULT, NO ACTION]

    SiblingsResponse:
      type: object
      required: [siblings]
      properties:
        instance:
          type: object
          required: [name, label]
          description: >
            This instance's own name and label, as the host configured them.
            Absent when not configured. Opaque: never parsed or acted on.
          properties:
            name:
              type: string
              minLength: 1
            label:
              type: string
              minLength: 1
        siblings:
          type: array
          description: >
            Configuration order. The sibling whose name and label equal
            `instance`'s is listed in place with healthy true and is never
            health-checked.
          items:
            type: object
            required: [name, base_url, healthy]
            properties:
              name:
                type: string
              label:
                type: string
                minLength: 1
                description: >
                  Opaque host-written label. Absent when not configured.
              base_url:
                type: string
              healthy:
                type: boolean
                description: >
                  For this instance's own entry, always true and never
                  checked. Otherwise true iff a GET to the sibling's health
                  path (resolved against its origin) returned 2xx within
                  the timeout.

    FilterCondition:
      type: object
      required: [column, op]
      properties:
        logic:
          type: string
          enum: [AND, OR]
          description: >
            Absent on the first condition, required on every subsequent
            one. AND binds tighter than OR (SQL precedence); no
            grouping/nesting exists.
        not:
          type: boolean
          default: false
          description: Wraps the condition's SQL fragment in NOT (...).
        column:
          type: string
          description: >
            Validated server-side against the table's real columns
            (case-sensitive) before reaching SQL; unknown column yields
            400.
        op:
          type: string
          enum: ["=", "!=", ">", "<", ">=", "<=", "LIKE", "ILIKE", "IS NULL", "IS NOT NULL"]
        value:
          type: string
          description: >
            Required for every op except IS NULL / IS NOT NULL, for which
            it must be absent. Always bound as a query parameter;
            comparison applies to the column cast to text.

    JoinColumnRef:
      type: object
      required: [join, column]
      additionalProperties: false
      properties:
        join:
          type: integer
          minimum: 0
          description: Table position; 0 is the base table.
        column:
          type: string

    JoinRequest:
      type: object
      required: [table, joins]
      additionalProperties: false
      properties:
        table:
          type: string
          description: The base table (position 0).
        joins:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [type, table, on]
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [inner, left]
              table:
                type: string
              on:
                type: array
                minItems: 1
                maxItems: 3
                description: Pairs combined with AND; equality only.
                items:
                  type: object
                  required: [left, right]
                  additionalProperties: false
                  properties:
                    left:
                      $ref: "#/components/schemas/JoinColumnRef"
                    right:
                      type: string
                      description: A column of this entry's own table.
        columns:
          type: array
          minItems: 1
          description: >
            Columns to return, in order. Absent means every column of
            every table.
          items:
            $ref: "#/components/schemas/JoinColumnRef"

    JoinFilterCondition:
      allOf:
        - $ref: "#/components/schemas/FilterCondition"
        - type: object
          properties:
            join:
              type: integer
              minimum: 0
              default: 0
              description: >
                Table position the condition's column belongs to. Out of
                range yields 400.

    JoinColumnInfo:
      allOf:
        - $ref: "#/components/schemas/ColumnInfo"
        - type: object
          required: [join, table, column]
          properties:
            join:
              type: integer
            table:
              type: string
            column:
              type: string
              description: >
                The real column name. `name` is a response label, unique
                within the response; clients never parse it.

    JoinResponse:
      type: object
      required: [columns, rows, has_more]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/JoinColumnInfo"
        rows:
          type: array
          description: >
            One object per row, keyed by column label. Values are JSON
            strings or null, as /tables/data.
          items:
            type: object
            additionalProperties:
              type: ["string", "null"]
        has_more:
          type: boolean

    ProblemDetails:
      type: object
      description: >
        RFC 9457 Problem Details (application/problem+json). Sent for
        every 4xx/5xx (spec/protocol.md §2). Additional members beyond
        those listed MAY appear; clients ignore unknown ones.
      required: [status, title, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: >
            Ashurbanipal defines no problem-type URI namespace; this is
            about:blank in practice. `code` is the discriminator.
        title:
          type: string
          description: Short human-readable summary; implementation-defined, do not parse.
        status:
          type: integer
          description: HTTP status code, repeated in the body (RFC 9457 §3.1).
        detail:
          type: string
          description: Optional longer human-readable explanation; do not parse.
        instance:
          type: string
          format: uri-reference
          description: Optional; identifies the specific occurrence.
        code:
          type: string
          description: >
            Stable machine-readable problem token — the value clients
            branch on. The set is open (additive); an unrecognized value
            is treated as a generic error of the given `status`.
          enum:
            - unknown_source
            - unknown_schema
            - unknown_table
            - unknown_column
            - invalid_filter
            - invalid_join
            - invalid_parameter
            - not_readable
            - database_error
            - query_timeout
            - invalid_config
