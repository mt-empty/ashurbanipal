[project]
name = "ashurbanipal-flask"
version = "0.1.1"
description = "Flask port of Ashurbanipal — spec/protocol.md read-only DB-browsing web UI"
readme = "README.md"
license = "MIT"
authors = [{ name = "MT" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
]
dependencies = [
    "flask>=3.0",
]

[project.urls]
Repository = "https://github.com/mt-empty/ashurbanipal"
Homepage = "https://github.com/mt-empty/ashurbanipal/tree/main/implementations/flask-python"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.4"]
mysql = ["pymysql>=1.1"]
# sqlite uses the stdlib sqlite3 module — no extra dependency.
dev = [
    "ashurbanipal-flask[postgres,mysql]",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs DATABASE_URL (skips cleanly otherwise)",
    "mysql: needs MYSQL_TEST_URL and/or MARIADB_TEST_URL (skips cleanly otherwise)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH"]

[build-system]
# hatchling 1.32.0 (2026-08-11) bumped its default core metadata version to
# 2.5, ahead of PyPI/pypa-gh-action-pypi-publish support — pin below it or
# `uv build` produces a wheel PyPI rejects with "'2.5' is not a valid
# metadata version".
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ashurbanipal"]
# Force-included despite being gitignored (generated fresh from
# ../../frontend/dbviewer.html by tools/sync-ports-frontend.sh, never
# committed) - hatchling's default packaging follows .gitignore like
# Cargo/npm, so without this the wheel silently ships without the file.
artifacts = ["ashurbanipal/frontend/dbviewer.html"]
