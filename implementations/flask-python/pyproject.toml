[project]
name = "ashurbanipal-flask"
version = "0.1.0"
description = "Flask port of Ashurbanipal — spec/protocol.md read-only DB-browsing web UI"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
# sqlite uses the stdlib sqlite3 module — no extra dependency.
dev = [
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ashurbanipal*"]
