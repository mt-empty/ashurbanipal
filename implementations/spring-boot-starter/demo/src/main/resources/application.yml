server:
  port: ${PORT:4100}
  # Tomcat's 8KB default rejects a spec-legal filter (up to 8192 decoded bytes,
  # percent-encoded) with an HTML 400 before the starter runs.
  max-http-request-header-size: 64KB

spring:
  application:
    name: ashurbanipal-spring-boot-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

ashurbanipal:
  enabled: ${ASHURBANIPAL_ENABLED:true}

---
# conformance/runner/two_source.rs's target — activate with
# SPRING_PROFILES_ACTIVE=conformance-second-source. Both entries must be
# spelled out, not just the new one: AshurbanipalProperties.resolvedSources
# only synthesizes the implicit "default" entry when the list is empty, and
# the base document above never sets ashurbanipal.sources at all.
spring:
  config:
    activate:
      on-profile: conformance-second-source

ashurbanipal:
  sources:
    - name: default
    - name: other_schema
      data-source-bean: otherSchemaDataSource

---
# conformance/runner/labelled_siblings.rs's target — activate with
# SPRING_PROFILES_ACTIVE=conformance-labelled-siblings. Port 9 refuses at
# once, so every health check is a fast healthy=false.
spring:
  config:
    activate:
      on-profile: conformance-labelled-siblings

ashurbanipal:
  instance:
    name: conformance
    label: a
  siblings:
    - name: conformance
      label: a
      base-url: http://127.0.0.1:9/__ashurbanipal
      health-path: /health
    - name: conformance
      label: b
      base-url: http://127.0.0.1:9/__ashurbanipal
      health-path: /health
    - name: other
      label: a
      base-url: http://127.0.0.1:9/__ashurbanipal
      health-path: /health
