server:
  port: ${PORT:4100}

spring:
  application:
    name: ashurbanipal-spring-boot-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

ashurbanipal:
  enabled: ${ASHURBANIPAL_ENABLED:true}

---
# conformance/runner/two_source.rs's target — activate with
# SPRING_PROFILES_ACTIVE=conformance-second-source. The base document
# above never sets ashurbanipal.sources at all — AshurbanipalProperties.
# resolvedSources only synthesizes the implicit single "default" entry
# when the config'd list is empty, so the moment *anything* is configured
# here, that fallback no longer applies and both entries need to be
# spelled out explicitly, not just the new one.
spring:
  config:
    activate:
      on-profile: conformance-second-source

ashurbanipal:
  sources:
    - name: default
    - name: other_schema
      data-source-bean: otherSchemaDataSource
