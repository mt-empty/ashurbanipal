[package]
name = "ashurbanipal-axum"
version = "0.2.1"
edition = "2021"
rust-version = "1.94"
description = "Embeddable, read-only web UI for browsing a service's own database tables"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mt-empty/ashurbanipal"
keywords = ["axum", "postgres", "admin", "database", "devtools"]
categories = ["web-programming", "database"]

[dependencies]
axum = "0.8"
ashurbanipal = { version = "0.2", path = "../core" }
sqlx = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }

[features]
default = ["postgres"]
# On by default: PgPoolSource is the reference backend. Disable
# default-features to drop it. See core/Cargo.toml.
postgres = ["ashurbanipal/postgres"]
# Off by default: keeps sqlx's sqlite feature out of the default build for
# hosts that only need Postgres. See docs/adapter-decisions.md for the
# per-clause decisions SqliteSource makes vs. the Postgres reference.
sqlite = ["ashurbanipal/sqlite"]
# Off by default, same rationale as `sqlite`. See docs/adapter-decisions.md
# for the per-clause decisions MySqlSource makes vs. the Postgres reference.
mysql = ["ashurbanipal/mysql"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"
dotenvy = "0.15"
escargot = "0.5.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "demo"

[[test]]
name = "conformance"
path = "../../../conformance/runner/main.rs"
