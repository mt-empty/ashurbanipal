[package]
name = "ashurbanipal"
version = "0.4.0"
edition = "2021"
rust-version = "1.94"
description = "Framework-agnostic core (config, DbSource backends, filter DSL) behind ashurbanipal-axum and ashurbanipal-actix-web"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mt-empty/ashurbanipal"
keywords = ["postgres", "sqlite", "mysql", "admin", "database"]
categories = ["database"]

[dependencies]
sqlx = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
# Current-thread only: every `#[tokio::test]` here is single-threaded and the
# `mysql` tests' Drop-guard builds its own `new_current_thread` runtime.
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["postgres"]
# On by default: PgPoolSource is the reference backend. Disable
# default-features to drop it (e.g. a SQLite-only or MySQL-only build never
# pulls in sqlx's postgres feature or its driver).
postgres = ["sqlx/postgres"]
# Off by default: keeps sqlx's sqlite feature out of the default build for
# hosts that only need Postgres. See docs/adapter-decisions.md for the
# per-clause decisions SqliteSource makes vs. the Postgres reference.
sqlite = ["sqlx/sqlite"]
# Off by default, same rationale as `sqlite`. See docs/adapter-decisions.md
# for the per-clause decisions MySqlSource makes vs. the Postgres reference.
mysql = ["sqlx/mysql"]
