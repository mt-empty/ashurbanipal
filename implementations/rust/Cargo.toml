[package]
name = "ashurbanipal"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Embeddable, read-only database browser for lower environments"
license = "MIT"

[dependencies]
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "json",
] }

[features]
# Spike-only, off by default: SQLite isn't a listed/conformant backend
# yet (docs/design.md §2 non-goal) — this feature exists to prototype
# SqliteSource without adding sqlx's sqlite feature to the default build.
sqlite = ["sqlx/sqlite"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"
dotenvy = "0.15"
escargot = "0.5.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "query"] }

[[example]]
name = "demo"

[[test]]
name = "conformance"
path = "../../conformance/runner/main.rs"
