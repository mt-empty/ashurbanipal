name: frontend e2e

on:
  push:
    branches: [main]
    paths:
      - "frontend/dbviewer.html"
      - "tools/e2e-tests/**"
      - "implementations/rust/**"
      - "conformance/seed/seed.sql"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/frontend.toml"
      - ".github/workflows/frontend-e2e.yml"
  pull_request:
    paths:
      - "frontend/dbviewer.html"
      - "tools/e2e-tests/**"
      - "implementations/rust/**"
      - "conformance/seed/seed.sql"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/frontend.toml"
      - ".github/workflows/frontend-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

permissions:
  contents: read

jobs:
  test-e2e:
    name: Playwright e2e suite against dbviewer.html (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One browser per runner: each gets all four vCPUs and its own demo server.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Seed database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/seed.sql

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.7.13
          install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "implementations/rust -> target"
          # The shards build the same demo; one cache, saved by one of them.
          shared-key: frontend-e2e
          save-if: ${{ matrix.browser == 'chromium' }}

      - run: mise run frontend:test-e2e-install

      # Not `mise run frontend:test-e2e`, which clears E2E_BROWSERS to always run all three.
      - run: mise exec -- pnpm exec playwright test --reporter=line,html
        working-directory: tools/e2e-tests
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: tools/e2e-tests/playwright-report/
          retention-days: 14
