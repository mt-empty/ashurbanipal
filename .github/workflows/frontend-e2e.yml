name: frontend e2e

on:
  push:
    branches: [main]
    paths:
      - "frontend/dbviewer.html"
      - "tools/e2e-tests/**"
      - "implementations/rust/**"
      - "conformance/seed/seed.sql"
      - ".github/workflows/frontend-e2e.yml"
  pull_request:
    paths:
      - "frontend/dbviewer.html"
      - "tools/e2e-tests/**"
      - "implementations/rust/**"
      - "conformance/seed/seed.sql"
      - ".github/workflows/frontend-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

jobs:
  test-e2e:
    name: Playwright e2e suite against dbviewer.html
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Seed database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/seed.sql

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "implementations/rust -> target"

      - run: mise run frontend:test-e2e-install

      - run: mise run frontend:test-e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tools/e2e-tests/playwright-report/
          retention-days: 14
