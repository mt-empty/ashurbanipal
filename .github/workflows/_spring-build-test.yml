name: _spring-build-test

# Shared by spring-boot-conformance.yml and spring-boot-starter-publish.yml
# — same role as _node-build-test.yml/_flask-build-test.yml/
# _rust-crate-build-test.yml have for their respective ports.

on:
  workflow_call:

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

jobs:
  build-and-test:
    name: gradle build (vendoring hash re-check + fixture/kill-switch/integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Apply the conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/seed.sql

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # `./gradlew build` runs `vendorFrontend` (PORTING.md's vendoring
      # contract) on every invocation, re-hashing
      # frontend/dbviewer.html against the pinned sha256 in build.gradle.kts
      # — a CI check, not a one-time fact recorded at vendoring time.
      - name: Build and test (fixture runner, kill-switch, live-DB integration)
        working-directory: implementations/spring-boot-starter
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spring-boot-test-report
          path: implementations/spring-boot-starter/build/reports/tests/test/
          retention-days: 14
