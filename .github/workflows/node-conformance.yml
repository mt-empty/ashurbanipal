name: node-express conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/node-express/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/node-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/node-express/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/node-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/_node-build-test.yml

  conformance:
    name: Node/Express — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: node
      node-version: "26"
      start-command: "cd implementations/node-express && pnpm install --frozen-lockfile && pnpm run demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: node-express-conformance-report

  schema-conformance:
    name: Node/Express — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: node
      node-version: "26"
      start-command: "cd implementations/node-express && pnpm install --frozen-lockfile && pnpm run demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
