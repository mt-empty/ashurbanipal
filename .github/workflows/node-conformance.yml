name: node-express conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/node-express/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/node-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/node-express/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/node-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_node-build-test.yml

  conformance:
    name: Node/Express — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: node
      node-version: "26"
      start-command: "cd implementations/node-express && pnpm install --frozen-lockfile && pnpm run demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: node-express-conformance-report

  # Same suite, run again (not instead) against a demo started with a
  # second source and labelled siblings — see rust-axum-conformance.yml's
  # identical job for the rationale.
  two-source-conformance:
    name: Node/Express — conformance kit (two-source round-trip, labelled siblings)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: node
      node-version: "26"
      start-command: "cd implementations/node-express && pnpm install --frozen-lockfile && pnpm run demo"
      start-env: "CONFORMANCE_SECOND_SOURCE=1 CONFORMANCE_LABELLED_SIBLINGS=1"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: node-express-conformance-two-source-report

  # The same suite against the demo on MySQL, MariaDB and SQLite, so each
  # port's other backends meet the protocol too.
  other-backend-conformance:
    name: Node/Express — conformance kit (${{ matrix.backend }} backend)
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, mariadb, sqlite]
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      backend: ${{ matrix.backend }}
      toolchain: node
      node-version: "26"
      start-command: "cd implementations/node-express && pnpm install --frozen-lockfile && pnpm run demo"
      start-env: ${{ matrix.backend == 'sqlite' && 'DB_BACKEND=sqlite SQLITE_PATH=$CONFORMANCE_SQLITE_PATH' || 'DB_BACKEND=mysql MYSQL_URL=$CONFORMANCE_MYSQL_URL' }}
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: node-express-conformance-${{ matrix.backend }}-report

  schema-conformance:
    name: Node/Express — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: node
      node-version: "26"
      start-command: "cd implementations/node-express && pnpm install --frozen-lockfile && pnpm run demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
