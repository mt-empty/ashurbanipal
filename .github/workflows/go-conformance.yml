name: go-nethttp conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/go-nethttp/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/go-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/go-nethttp/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/go-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

permissions:
  contents: read

jobs:
  build-and-test:
    name: go build/vet/fmt + fixture/kill-switch/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The MySQL/MariaDB tests skip without these URLs; each creates its own database.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ashurbanipal
          MYSQL_DATABASE: ashurbanipal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pashurbanipal"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ashurbanipal
          MARIADB_DATABASE: ashurbanipal
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:ashurbanipal@127.0.0.1:3306/ashurbanipal
      MARIADB_TEST_URL: mysql://root:ashurbanipal@127.0.0.1:3307/ashurbanipal
    steps:
      - uses: actions/checkout@v7

      - name: Apply the conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/seed.sql

      - uses: actions/setup-go@v7
        with:
          go-version-file: implementations/go-nethttp/go.mod
          cache-dependency-path: implementations/go-nethttp/go.sum

      - name: Build
        working-directory: implementations/go-nethttp
        run: go build ./...

      - name: gofmt check
        working-directory: implementations/go-nethttp
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would reformat:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: implementations/go-nethttp
        run: go vet -tags sqlite,mysql ./...

      # Both version inputs stay empty so the action reuses the Go installed
      # above: its pinned setup-go ignores go.mod's toolchain line and would
      # scan the older stdlib named by the go line.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ''
          cache-dependency-path: implementations/go-nethttp/go.sum
          work-dir: implementations/go-nethttp

      # The sqlite and mysql test files only compile with their build tags.
      # integration_test.go needs DATABASE_URL (set above) and the
      # conformance seed; the mysql tests skip without MYSQL_TEST_URL.
      - name: Test
        working-directory: implementations/go-nethttp
        run: go test -race -tags sqlite,mysql ./...

  conformance:
    name: Go — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: go
      go-version-file: implementations/go-nethttp/go.mod
      start-command: "cd implementations/go-nethttp && go run ./cmd/demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: go-nethttp-conformance-report

  # Same suite, run again (not instead) against a demo started with a
  # second source and labelled siblings — see rust-axum-conformance.yml's
  # identical job for the rationale.
  two-source-conformance:
    name: Go — conformance kit (two-source round-trip, labelled siblings)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: go
      go-version-file: implementations/go-nethttp/go.mod
      start-command: "cd implementations/go-nethttp && go run ./cmd/demo"
      start-env: "CONFORMANCE_SECOND_SOURCE=1 CONFORMANCE_LABELLED_SIBLINGS=1"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: go-nethttp-conformance-two-source-report

  # The same suite against the demo on MySQL, MariaDB and SQLite, so each
  # port's other backends meet the protocol too.
  other-backend-conformance:
    name: Go — conformance kit (${{ matrix.backend }} backend)
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, mariadb, sqlite]
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      backend: ${{ matrix.backend }}
      toolchain: go
      go-version-file: implementations/go-nethttp/go.mod
      start-command: "cd implementations/go-nethttp && go run -tags sqlite,mysql ./cmd/demo"
      start-env: ${{ matrix.backend == 'sqlite' && 'DB_BACKEND=sqlite SQLITE_PATH=$CONFORMANCE_SQLITE_PATH' || 'DB_BACKEND=mysql MYSQL_URL=$CONFORMANCE_MYSQL_URL' }}
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: go-nethttp-conformance-${{ matrix.backend }}-report

  schema-conformance:
    name: Go — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: go
      go-version-file: implementations/go-nethttp/go.mod
      start-command: "cd implementations/go-nethttp && go run ./cmd/demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
