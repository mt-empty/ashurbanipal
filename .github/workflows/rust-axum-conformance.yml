name: rust axum conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/rust/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".devcontainer/db/init/01-seed.sql"
      - "tools/seed-gen/**"
      - ".github/workflows/rust-axum-conformance.yml"
      - ".github/workflows/_rust-crate-build-test.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/rust/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".devcontainer/db/init/01-seed.sql"
      - "tools/seed-gen/**"
      - ".github/workflows/rust-axum-conformance.yml"
      - ".github/workflows/_rust-crate-build-test.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Covers the whole workspace (axum, core, actix-web) in one run — they
  # share implementations/rust/Cargo.lock, so rust-actix-web-conformance.yml
  # doesn't need a duplicate job.
  cargo-audit:
    name: cargo audit (RustSec advisory database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: implementations/rust
          # RUSTSEC-2026-0258 (h2 unbounded empty DATA frames, low-severity
          # DoS): reached only transitively via actix-http -> actix-web, which
          # still pins h2 0.3.x — no patched actix-http or h2 0.3.x release
          # exists yet. Drop this once actix-web ships an h2 0.4.16+ dep.
          ignore: RUSTSEC-2026-0258

  build-and-test:
    uses: ./.github/workflows/_rust-crate-build-test.yml

  conformance:
    name: Rust — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: conformance-report

  # Same suite, run again (not instead) against a demo started with a
  # second source and labelled siblings — conformance/runner/two_source.rs
  # and labelled_siblings.rs are what this proves beyond the job above. The
  # two configs are independent, so one demo carries both; the job above
  # must stay unconfigured to prove /api/siblings' default shape.
  two-source-conformance:
    name: Rust — conformance kit (two-source round-trip, labelled siblings)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      start-env: "CONFORMANCE_SECOND_SOURCE=1 CONFORMANCE_LABELLED_SIBLINGS=1"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: conformance-two-source-report

  schema-conformance:
    name: Rust — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"

  # The sqlite/mysql DbSource adapters (off by default) — feature lint,
  # inline unit tests, and the axum-level integration tests. Its own job
  # (not folded into _rust-crate-build-test.yml) so the MySQL/MariaDB
  # services don't reach the publish-check path.
  non-default-backend-tests:
    name: Rust — sqlite + mysql feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ashurbanipal
          MYSQL_DATABASE: ashurbanipal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pashurbanipal"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ashurbanipal
          MARIADB_DATABASE: ashurbanipal
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:ashurbanipal@127.0.0.1:3306/ashurbanipal
      MARIADB_TEST_URL: mysql://root:ashurbanipal@127.0.0.1:3307/ashurbanipal
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.13
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2
        with:
          workspaces: "implementations/rust -> target"
      - run: mise run rust:backends

  other-backend-conformance:
    name: Rust — conformance kit (${{ matrix.backend }} backend)
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, mariadb, sqlite]
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      backend: ${{ matrix.backend }}
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --features mysql,sqlite --example demo"
      start-env: ${{ matrix.backend == 'sqlite' && 'DB_BACKEND=sqlite SQLITE_PATH=sqlite://$CONFORMANCE_SQLITE_PATH' || 'DB_BACKEND=mysql DATABASE_URL=$CONFORMANCE_MYSQL_URL' }}
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: conformance-${{ matrix.backend }}-report
