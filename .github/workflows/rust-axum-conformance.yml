name: rust axum conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/rust/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".devcontainer/db/init/01-seed.sql"
      - "tools/seed-gen/**"
      - ".github/workflows/rust-axum-conformance.yml"
      - ".github/workflows/_rust-crate-build-test.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/rust/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".devcontainer/db/init/01-seed.sql"
      - "tools/seed-gen/**"
      - ".github/workflows/rust-axum-conformance.yml"
      - ".github/workflows/_rust-crate-build-test.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Covers the whole workspace (axum, core, actix-web) in one run — they
  # share implementations/rust/Cargo.lock, so rust-actix-web-conformance.yml
  # doesn't need a duplicate job.
  cargo-audit:
    name: cargo audit (RustSec advisory database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: implementations/rust
          # RUSTSEC-2026-0258 (h2 unbounded empty DATA frames, low-severity
          # DoS): reached only transitively via actix-http -> actix-web, which
          # still pins h2 0.3.x — no patched actix-http or h2 0.3.x release
          # exists yet. Drop this once actix-web ships an h2 0.4.16+ dep.
          ignore: RUSTSEC-2026-0258

  build-and-test:
    uses: ./.github/workflows/_rust-crate-build-test.yml

  conformance:
    name: Rust — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: conformance-report

  # Same suite, run again (not instead) against a demo started with a
  # second source registered — conformance/runner/two_source.rs is the
  # only thing this proves beyond the job above.
  two-source-conformance:
    name: Rust — conformance kit (two-source round-trip)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      start-env: "CONFORMANCE_SECOND_SOURCE=1"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: conformance-two-source-report

  schema-conformance:
    name: Rust — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"

  # The sqlite/mysql DbSource adapters (off by default) — feature lint,
  # inline unit tests, and the axum-level integration tests. Its own job
  # (not folded into _rust-crate-build-test.yml) so the MySQL/MariaDB
  # services don't reach the publish-check path.
  non-default-backend-tests:
    name: Rust — sqlite + mysql feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ashurbanipal
          MYSQL_DATABASE: ashurbanipal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pashurbanipal"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ashurbanipal
          MARIADB_DATABASE: ashurbanipal
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:ashurbanipal@127.0.0.1:3306/ashurbanipal
      MARIADB_TEST_URL: mysql://root:ashurbanipal@127.0.0.1:3307/ashurbanipal
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "implementations/rust -> target"
      - run: mise run rust:backends

  mysql-conformance:
    name: Rust — conformance kit (MySQL backend)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ashurbanipal
          MYSQL_DATABASE: ashurbanipal
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pashurbanipal"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mysql://root:ashurbanipal@127.0.0.1:3306/ashurbanipal
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "implementations/rust -> target"
      - name: Apply the MySQL conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ashurbanipal ashurbanipal < conformance/seed/seed.mysql.sql
      - name: Start the demo (mysql backend)
        run: |
          DB_BACKEND=mysql cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --features mysql --example demo &
          echo $! > /tmp/demo.pid
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4000/health >/dev/null && exit 0
            sleep 2
          done
          echo "demo did not become healthy in time" >&2
          exit 1
      - name: Run the conformance kit against it (MySQL)
        env:
          ASHURBANIPAL_CONFORMANCE_URL: http://localhost:4000/__ashurbanipal
        run: bash conformance/runner/report.sh
      - name: Stop the demo
        if: always()
        run: kill "$(cat /tmp/demo.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-mysql-report
          path: conformance-report.json
          retention-days: 14

  sqlite-conformance:
    name: Rust — conformance kit (SQLite backend)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "implementations/rust -> target"
      - name: Apply the SQLite conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          sqlite3 "$GITHUB_WORKSPACE/conf.sqlite" < conformance/seed/seed.sqlite.sql
      - name: Start the demo (sqlite backend)
        run: |
          DB_BACKEND=sqlite SQLITE_PATH="sqlite://$GITHUB_WORKSPACE/conf.sqlite" \
            cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --features sqlite --example demo &
          echo $! > /tmp/demo.pid
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4000/health >/dev/null && exit 0
            sleep 2
          done
          echo "demo did not become healthy in time" >&2
          exit 1
      - name: Run the conformance kit against it (SQLite)
        env:
          ASHURBANIPAL_CONFORMANCE_URL: http://localhost:4000/__ashurbanipal
        run: bash conformance/runner/report.sh
      - name: Stop the demo
        if: always()
        run: kill "$(cat /tmp/demo.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-sqlite-report
          path: conformance-report.json
          retention-days: 14
