name: rust-actix-web-publish

# Publishes implementations/rust/actix-web to crates.io as
# `ashurbanipal-actix-web`, gated on an ashurbanipal-actix-web-v* tag (see
# docs/publishing-checklist.md's per-port tag scheme — this crate's tags
# never share rust-axum-publish.yml's ashurbanipal-axum-v* or
# rust-core-publish.yml's ashurbanipal-v*). Tag/version verification and
# build+dry-run-package are shared with those two workflows via
# _rust-crate-publish-check.yml — see that file's header for the Trusted
# Publishing bootstrap caveat. The post-release job then creates the GitHub
# Release with git-cliff-generated notes.

on:
  push:
    tags: ["ashurbanipal-actix-web-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify-and-build:
    uses: ./.github/workflows/_rust-crate-publish-check.yml
    with:
      tag-prefix: "ashurbanipal-actix-web-v"
      crate-name: "ashurbanipal-actix-web"
      crate-dir: "implementations/rust/actix-web"

  conformance:
    name: Rust actix-web — conformance kit (external-URL path)
    needs: verify-and-build
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-actix-web --manifest-path implementations/rust/actix-web/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: rust-actix-web-publish-conformance-report

  schema-conformance:
    name: Rust actix-web — schema conformance
    needs: verify-and-build
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-actix-web --manifest-path implementations/rust/actix-web/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"

  publish:
    name: cargo publish (crates.io Trusted Publishing)
    needs: [conformance, schema-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this GitHub Environment (Settings > Environments) with
    # required reviewers if a manual approval gate before an irreversible
    # (yank-only) publish is wanted — inert with no protection rules set.
    environment:
      name: crates-io-publish
      url: https://crates.io/crates/ashurbanipal-actix-web
    permissions:
      contents: read
      id-token: write # required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        working-directory: implementations/rust/actix-web
        run: cargo publish -p ashurbanipal-actix-web
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # A Release hiccup must never wedge the already-completed, irreversible
  # crates.io publish in `needs: publish` — hence a separate job + continue-on-error.
  post-release:
    needs: publish
    permissions:
      contents: write
    continue-on-error: true
    uses: ./.github/workflows/_post-release.yml
    with:
      tag-pattern: '^ashurbanipal-actix-web-v'
      include-paths: 'implementations/rust/actix-web/** implementations/rust/core/** frontend/** spec/**'
