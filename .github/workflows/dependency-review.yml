name: dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Fail on newly-introduced high-severity vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
