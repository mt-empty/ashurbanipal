name: conformance

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

jobs:
  conformance:
    name: conformance kit (external-URL path)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Apply the conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f conformance/seed/seed.sql

      - uses: jdx/mise-action@v4
        with:
          install: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same reference the spawned test path builds — started here by hand,
      # not by the runner, so the runner's ASHURBANIPAL_CONFORMANCE_URL run
      # below takes the exact external-URL path a port's own CI would use.
      - name: Start the reference demo
        run: |
          cargo run --example demo &
          echo $! > demo.pid
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4000/health >/dev/null && exit 0
            sleep 1
          done
          echo "demo server did not become healthy in time" >&2
          exit 1

      - name: Run the conformance kit against it (external path)
        env:
          ASHURBANIPAL_CONFORMANCE_URL: http://localhost:4000/__ashurbanipal
        run: bash conformance/runner/report.sh

      - name: Stop the reference demo
        if: always()
        run: kill "$(cat demo.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json
          retention-days: 14
