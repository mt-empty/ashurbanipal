name: _post-release

# Shared by every port's *-publish.yml (and go-nethttp-publish.yml): after the
# registry publish succeeds, create/update the GitHub Release for the pushed
# tag. Kept a separate reusable workflow, and a separate job in the caller
# (needs: publish) with continue-on-error, so a Release hiccup can never wedge
# the already-completed, irreversible registry publish.
#
# The body is the "## [X.Y.Z]" section of the port's own committed CHANGELOG.md
# — written and reviewed in the release PR (docs/publishing-checklist.md step 2),
# and version-matched to the manifest by `changelog:check`. Regenerating notes
# here with `git-cliff --current` was unreliable: a feature release lands every
# port's tag on one squash-merge commit, and git-cliff resolves only one tag per
# commit, so all but one port failed with "No tag exists for the current commit"
# (orhun/git-cliff#149, #1036).
#
# Version for the Release title is `${GITHUB_REF_NAME##*v}` — strips every port
# prefix (ashurbanipal-axum-v0.5.0, implementations/go-nethttp/v0.5.0, …) down
# to the bare semver, since no prefix segment or semver contains a lone 'v'.

on:
  workflow_call:
    inputs:
      changelog-path:
        description: "This port's CHANGELOG.md, e.g. implementations/rust/axum/CHANGELOG.md — its '## [X.Y.Z]' section (X.Y.Z taken from the tag) becomes the Release body"
        required: true
        type: string
      title-prefix:
        description: 'Text before the version in the Release title — every caller passes its package name plus a trailing space, e.g. "ashurbanipal-axum ", so the title reads "ashurbanipal-axum 0.4.0" and the Releases list stays scannable'
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write # create/edit the Release
    steps:
      - uses: actions/checkout@v7

      - name: Create/update the Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME##*v}"
          changelog='${{ inputs.changelog-path }}'

          # continue-on-error at the caller keeps a Release failure from wedging
          # the done, irreversible registry publish — but that also greens the
          # run, so make the gap loud instead of failing silently.
          if [ ! -f "$changelog" ]; then
            echo "::error::$changelog not found — GitHub Release NOT created for $GITHUB_REF_NAME (registry publish already done)."
            echo "❌ \`$changelog\` not found — GitHub Release NOT created for \`$GITHUB_REF_NAME\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Body = the "## [X.Y.Z] …" section: literal-prefix match on the
          # heading (Keep a Changelog — the same shape tools/check-changelogs.sh
          # requires and the publish workflow's verify job gates on), through to
          # the next "## " heading or EOF.
          hdr="## [$version]"
          awk -v hdr="$hdr" '
            substr($0, 1, length(hdr)) == hdr { grab = 1; print; next }
            grab && /^## / { exit }
            grab { print }
          ' "$changelog" > NOTES.md

          if ! grep -q '[^[:space:]]' NOTES.md; then
            echo "::error::no '## [$version]' section in $changelog — GitHub Release NOT created for $GITHUB_REF_NAME (registry publish already done)."
            echo "❌ No \`## [$version]\` section in \`$changelog\` — GitHub Release NOT created for \`$GITHUB_REF_NAME\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          title="${{ inputs.title-prefix }}${version}"
          gh release create "$GITHUB_REF_NAME" --notes-file NOTES.md --title "$title" --verify-tag \
            || gh release edit "$GITHUB_REF_NAME" --notes-file NOTES.md --title "$title"
