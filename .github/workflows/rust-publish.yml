name: rust-publish

# Publishes implementations/rust to crates.io as `ashurbanipal-axum`, gated
# on a rust-v* tag (see docs/publishing-checklist.md's per-port tag scheme
# — this crate's tags never share the bare v* release.yml uses).
#
# Prerequisite this workflow can't do for you: crates.io only lets you
# create a Trusted Publisher Config (the OIDC setup this workflow relies
# on, via rust-lang/crates-io-auth-action) for a crate that already
# exists. The very first `cargo publish` for ashurbanipal-axum has to be
# done manually, once, with a classic API token
# (https://crates.io/docs/trusted-publishing) — after that one-time
# bootstrap, every release from here on flows through this workflow with
# no stored secret at all.

on:
  push:
    tags: ["rust-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-branch:
    name: verify tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history to check branch ancestry

      - name: Check that the tagged commit is on main
        run: |
          if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/main$'; then
            echo "tag ${{ github.ref_name }} (${{ github.sha }}) is not on main — refusing to publish" >&2
            exit 1
          fi

  verify-version:
    name: tag matches Cargo.toml version
    needs: check-branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag to implementations/rust/Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#rust-v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' implementations/rust/Cargo.toml | head -1)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME implies version $tag_version, but implementations/rust/Cargo.toml has $cargo_version" >&2
            exit 1
          fi

  build-and-test:
    name: cargo fmt/clippy/test --lib + seed sync check
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            implementations/rust -> target
            tools/seed-gen -> target

      - run: mise run conformance:seed-check

      - run: mise run rust

      - name: cargo publish --dry-run (packaging check only)
        working-directory: implementations/rust
        # -p is required now that this is a workspace with sibling members
        # (ashurbanipal core, ashurbanipal-actix-web) — a bare `cargo
        # publish` silently resolves to the wrong package otherwise.
        run: cargo publish -p ashurbanipal-axum --dry-run

  conformance:
    name: Rust — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: rust-publish-conformance-report

  schema-conformance:
    name: Rust — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"

  publish:
    name: cargo publish (crates.io Trusted Publishing)
    needs: [conformance, schema-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this GitHub Environment (Settings > Environments) with
    # required reviewers if a manual approval gate before an irreversible
    # (yank-only) publish is wanted — inert with no protection rules set.
    environment: crates-io-publish
    permissions:
      contents: read
      id-token: write # required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        working-directory: implementations/rust
        # -p is required now that this is a workspace with sibling members
        # (ashurbanipal core, ashurbanipal-actix-web) — a bare `cargo
        # publish` silently resolves to the wrong package otherwise.
        run: cargo publish -p ashurbanipal-axum
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
