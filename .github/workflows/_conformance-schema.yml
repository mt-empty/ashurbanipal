name: _conformance-schema

# Reusable (workflow_call only) layer-2 shape-conformance job: schemathesis
# fired at spec/openapi.yaml against a spawned demo. A separate job from
# _conformance-behavior.yml so a shape failure and a behavior failure never
# interleave in one log — see COVERAGE.md.

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Language toolchain the demo needs to start: rust | java | go | node | python"
        required: true
        type: string
      go-version-file:
        description: "go.mod path to pin the Go version from (required when toolchain == 'go')"
        required: false
        type: string
        default: ""
      node-version:
        description: "Node version to install (required when toolchain == 'node')"
        required: false
        type: string
        default: ""
      python-version:
        description: "Python version to install (required when toolchain == 'python')"
        required: false
        type: string
        default: ""
      start-command:
        description: "Foreground command that starts the demo (backgrounded by this workflow)"
        required: true
        type: string
      start-env:
        description: "Optional space-separated KEY=VALUE pairs exported before start-command runs"
        required: false
        type: string
        default: ""
      health-url:
        description: "URL polled until it responds 2xx, signaling the demo is ready"
        required: true
        type: string
      conformance-url:
        description: "ASHURBANIPAL_CONFORMANCE_URL schema-check.sh runs against"
        required: true
        type: string
      seed:
        description: "Optional schemathesis --seed; empty means a random seed per run"
        required: false
        type: string
        default: ""

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

permissions:
  contents: read

jobs:
  schema-conformance:
    name: schema conformance (schemathesis vs spec/openapi.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply the conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/seed.sql

      - name: Set up Java toolchain
        if: inputs.toolchain == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go toolchain
        if: inputs.toolchain == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: implementations/go-nethttp/go.sum

      - name: Set up pnpm
        if: inputs.toolchain == 'node'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Set up Node toolchain
        if: inputs.toolchain == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Every toolchain needs uv: schemathesis installs from its uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "implementations/rust -> target"

      - name: Install schemathesis
        run: uv sync --locked --project conformance/schemathesis
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-schemathesis

      - name: Start the demo
        run: |
          # Both inputs are shell source from same-repo callers: start-env may reference
          # $GITHUB_ENV values and start-command chains with `&&`, so they must be eval'd.
          if [ -n "$INPUTS_START_ENV" ]; then eval "export $INPUTS_START_ENV"; fi
          eval "$INPUTS_START_COMMAND" &
          echo $! > /tmp/demo.pid
          for _ in $(seq 1 60); do
            curl -sf "${INPUTS_HEALTH_URL}" >/dev/null && exit 0
            sleep 2
          done
          echo "demo did not become healthy in time" >&2
          exit 1
        env:
          INPUTS_START_ENV: ${{ inputs.start-env }}
          INPUTS_START_COMMAND: ${{ inputs.start-command }}
          INPUTS_HEALTH_URL: ${{ inputs.health-url }}

      - name: Run schemathesis against it (layer 2, shape)
        env:
          ASHURBANIPAL_CONFORMANCE_URL: ${{ inputs.conformance-url }}
          ASHURBANIPAL_SCHEMA_CHECK_SEED: ${{ inputs.seed }}
        run: bash conformance/runner/schema-check.sh

      - name: Stop the demo
        if: always()
        run: kill "$(cat /tmp/demo.pid)" 2>/dev/null || true
