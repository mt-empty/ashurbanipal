name: _conformance-schema

# Reusable (workflow_call only) layer-2 shape-conformance job: schemathesis
# fired at spec/openapi.yaml against a spawned demo. A separate job from
# _conformance-behavior.yml so a shape failure and a behavior failure never
# interleave in one log — see COVERAGE.md.

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Language toolchain the demo needs to start: rust | java | go"
        required: true
        type: string
      go-version-file:
        description: "go.mod path to pin the Go version from (required when toolchain == 'go')"
        required: false
        type: string
        default: ""
      start-command:
        description: "Foreground command that starts the demo (backgrounded by this workflow)"
        required: true
        type: string
      start-env:
        description: "Optional space-separated KEY=VALUE pairs exported before start-command runs"
        required: false
        type: string
        default: ""
      health-url:
        description: "URL polled until it responds 2xx, signaling the demo is ready"
        required: true
        type: string
      conformance-url:
        description: "ASHURBANIPAL_CONFORMANCE_URL schema-check.sh runs against"
        required: true
        type: string

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

jobs:
  schema-conformance:
    name: schema conformance (schemathesis vs spec/openapi.yaml)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Apply the conformance seed
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f conformance/seed/seed.sql

      - name: Set up Java toolchain
        if: inputs.toolchain == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go toolchain
        if: inputs.toolchain == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "implementations/rust -> target"

      - name: Install schemathesis
        run: python3 -m venv .venv-schemathesis && .venv-schemathesis/bin/pip install --upgrade pip schemathesis

      - name: Start the demo
        run: |
          ${{ inputs.start-env && format('export {0}', inputs.start-env) || 'true' }}
          ${{ inputs.start-command }} &
          echo $! > /tmp/demo.pid
          for _ in $(seq 1 60); do
            curl -sf "${{ inputs.health-url }}" >/dev/null && exit 0
            sleep 2
          done
          echo "demo did not become healthy in time" >&2
          exit 1

      - name: Run schemathesis against it (layer 2, shape)
        env:
          ASHURBANIPAL_CONFORMANCE_URL: ${{ inputs.conformance-url }}
        run: bash conformance/runner/schema-check.sh

      - name: Stop the demo
        if: always()
        run: kill "$(cat /tmp/demo.pid)" 2>/dev/null || true
