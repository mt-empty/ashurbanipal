name: _conformance-behavior

# Reusable (workflow_call only — no push/pull_request triggers, never runs
# on its own) layer-3 behavior-conformance job: start an implementation's
# demo, point the conformance kit at it over HTTP, upload the report. Kept
# as its own job (not merged with schema conformance) so a shape failure
# and a behavior failure never interleave in one log — see COVERAGE.md.

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Language toolchain the demo needs to start: rust | java | go | node | python"
        required: true
        type: string
      go-version-file:
        description: "go.mod path to pin the Go version from (required when toolchain == 'go')"
        required: false
        type: string
        default: ""
      node-version:
        description: "Node version to install (required when toolchain == 'node')"
        required: false
        type: string
        default: ""
      python-version:
        description: "Python version to install (required when toolchain == 'python')"
        required: false
        type: string
        default: ""
      start-command:
        description: "Foreground command that starts the demo (backgrounded by this workflow)"
        required: true
        type: string
      start-env:
        description: "Optional space-separated KEY=VALUE pairs exported before start-command runs"
        required: false
        type: string
        default: ""
      health-url:
        description: "URL polled until it responds 2xx, signaling the demo is ready"
        required: true
        type: string
      conformance-url:
        description: "ASHURBANIPAL_CONFORMANCE_URL the kit runs against"
        required: true
        type: string
      report-name:
        description: "Artifact name for the uploaded conformance-report.json"
        required: true
        type: string
      backend:
        description: >-
          Database the demo browses: postgres | postgres-readonly | mysql |
          mariadb | sqlite. Exports CONFORMANCE_MYSQL_URL (mysql:// URL),
          CONFORMANCE_JDBC_URL, CONFORMANCE_SQLITE_PATH and, for
          postgres-readonly, CONFORMANCE_PG_RO_URL plus CONFORMANCE_PG_RO_USER
          and CONFORMANCE_PG_RO_PASSWORD (a SELECT-only role) for start-env to
          pass on; it also sets CONFORMANCE_EXPECT_READONLY_PROBE=1 so the
          runner fails, not skips, the readonly_probe check.
        required: false
        type: string
        default: postgres
      expect-host-check:
        description: >-
          Sets CONFORMANCE_EXPECT_HOST_CHECK=1 for the runner, so
          host_allow_list.rs fails rather than skips; for a demo started with
          CONFORMANCE_ALLOWED_HOSTS=1 (Spring: profile conformance-allowed-hosts).
        required: false
        type: boolean
        default: false
      engine-image:
        description: >-
          Docker image to run instead of the backend's default, to test
          another engine version (e.g. postgres:15.20-alpine, mariadb:10.11.19).
          Applies to the postgres, postgres-readonly, mysql and mariadb backends.
        required: false
        type: string
        default: ""

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

permissions:
  contents: read

jobs:
  conformance:
    name: conformance kit (layer 3, behavior — external-URL path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        # Tag-pinned like every other service image here; only same-repo callers set the input.
        image: ${{ startsWith(inputs.backend, 'postgres') && inputs.engine-image || 'postgres:18.4-alpine' }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply the conformance seed
        if: inputs.backend == 'postgres' || inputs.backend == 'postgres-readonly'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/seed.sql

      - name: Add the SELECT-only role
        if: inputs.backend == 'postgres-readonly'
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f conformance/seed/readonly-role.sql
          {
            echo "CONFORMANCE_PG_RO_USER=ashurbanipal_ro"
            echo "CONFORMANCE_PG_RO_PASSWORD=ashurbanipal_ro"
            echo "CONFORMANCE_PG_RO_URL=postgres://ashurbanipal_ro:ashurbanipal_ro@localhost:5432/ashurbanipal"
            echo "CONFORMANCE_EXPECT_READONLY_PROBE=1"
          } >> "$GITHUB_ENV"

      - name: Start ${{ inputs.backend }} and apply the MySQL conformance seed
        if: inputs.backend == 'mysql' || inputs.backend == 'mariadb'
        run: |
          if [ "${INPUTS_BACKEND}" = mysql ]; then
            docker run -d --name conformance-db -p 3306:3306 \
              -e MYSQL_ROOT_PASSWORD=ashurbanipal -e MYSQL_DATABASE=ashurbanipal "${INPUTS_ENGINE_IMAGE:-mysql:8.4.13}"
          else
            docker run -d --name conformance-db -p 3306:3306 \
              -e MARIADB_ROOT_PASSWORD=ashurbanipal -e MARIADB_DATABASE=ashurbanipal "${INPUTS_ENGINE_IMAGE:-mariadb:11.8.8}"
          fi
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          for _ in $(seq 1 60); do
            mysql --host=127.0.0.1 --user=root --password=ashurbanipal -e 'select 1' ashurbanipal >/dev/null 2>&1 && break
            sleep 2
          done
          mysql --host=127.0.0.1 --user=root --password=ashurbanipal ashurbanipal < conformance/seed/seed.mysql.sql
          {
            echo "CONFORMANCE_MYSQL_URL=mysql://root:ashurbanipal@127.0.0.1:3306/ashurbanipal"
            echo "CONFORMANCE_JDBC_URL=jdbc:mysql://127.0.0.1:3306/ashurbanipal?allowPublicKeyRetrieval=true&useSSL=false"
          } >> "$GITHUB_ENV"
        env:
          INPUTS_BACKEND: ${{ inputs.backend }}
          INPUTS_ENGINE_IMAGE: ${{ inputs.engine-image }}

      - name: Apply the SQLite conformance seed
        if: inputs.backend == 'sqlite'
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          sqlite3 "$RUNNER_TEMP/conformance.sqlite" < conformance/seed/seed.sqlite.sql
          {
            echo "CONFORMANCE_SQLITE_PATH=$RUNNER_TEMP/conformance.sqlite"
            echo "CONFORMANCE_JDBC_URL=jdbc:sqlite:$RUNNER_TEMP/conformance.sqlite"
          } >> "$GITHUB_ENV"

      - name: Set up Java toolchain
        if: inputs.toolchain == 'java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go toolchain
        if: inputs.toolchain == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: implementations/go-nethttp/go.sum

      - name: Set up pnpm
        if: inputs.toolchain == 'node'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Set up Node toolchain
        if: inputs.toolchain == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up uv (Python toolchain)
        if: inputs.toolchain == 'python'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      # The conformance runner itself (layer 3) is Rust regardless of which
      # implementation is under test — report.sh always runs `cargo test`
      # inside implementations/rust, per PORTING.md.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "implementations/rust -> target"

      - name: Start the demo
        run: |
          # Both inputs are shell source from same-repo callers: start-env may reference
          # $GITHUB_ENV values and start-command chains with `&&`. setsid gives the demo its
          # own process group so "Stop the demo" can kill the whole chain, not just a wrapper.
          if [ -n "$INPUTS_START_ENV" ]; then eval "export $INPUTS_START_ENV"; fi
          setsid bash -c "$INPUTS_START_COMMAND" &
          echo $! > /tmp/demo.pid
          for _ in $(seq 1 60); do
            curl -sf "${INPUTS_HEALTH_URL}" >/dev/null && exit 0
            sleep 2
          done
          echo "demo did not become healthy in time" >&2
          exit 1
        env:
          INPUTS_START_ENV: ${{ inputs.start-env }}
          INPUTS_START_COMMAND: ${{ inputs.start-command }}
          INPUTS_HEALTH_URL: ${{ inputs.health-url }}

      - name: Run the conformance kit against it (layer 3, behavior)
        env:
          ASHURBANIPAL_CONFORMANCE_URL: ${{ inputs.conformance-url }}
          INPUTS_EXPECT_HOST_CHECK: ${{ inputs.expect-host-check }}
        run: |
          if [ "$INPUTS_EXPECT_HOST_CHECK" = true ]; then export CONFORMANCE_EXPECT_HOST_CHECK=1; fi
          bash conformance/runner/report.sh

      - name: Stop the demo
        if: always()
        run: kill -- -"$(cat /tmp/demo.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.report-name }}
          path: conformance-report.json
          retention-days: 14
