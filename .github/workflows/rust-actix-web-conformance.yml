name: rust actix-web conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/rust/actix-web/**"
      - "implementations/rust/core/**"
      - "implementations/rust/Cargo.toml"
      - "implementations/rust/Cargo.lock"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".devcontainer/db/init/01-seed.sql"
      - "tools/seed-gen/**"
      - ".github/workflows/rust-actix-web-conformance.yml"
      - ".github/workflows/_rust-crate-build-test.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/rust/actix-web/**"
      - "implementations/rust/core/**"
      - "implementations/rust/Cargo.toml"
      - "implementations/rust/Cargo.lock"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".devcontainer/db/init/01-seed.sql"
      - "tools/seed-gen/**"
      - ".github/workflows/rust-actix-web-conformance.yml"
      - ".github/workflows/_rust-crate-build-test.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/_rust-crate-build-test.yml

  conformance:
    name: Rust actix-web — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-actix-web --manifest-path implementations/rust/actix-web/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: conformance-report-actix-web

  schema-conformance:
    name: Rust actix-web — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-actix-web --manifest-path implementations/rust/actix-web/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
