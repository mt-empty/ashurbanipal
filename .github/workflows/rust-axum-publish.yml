name: rust-axum-publish

# Publishes implementations/rust/axum to crates.io as `ashurbanipal-axum`,
# gated on an ashurbanipal-axum-v* tag (see docs/publishing-checklist.md's
# per-port tag scheme — this crate's tags never share rust-core-publish.yml's
# ashurbanipal-v* or rust-actix-web-publish.yml's ashurbanipal-actix-web-v*).
# Tag/version verification and build+dry-run-package are shared with those two
# workflows via _rust-crate-publish-check.yml — see that file's header for the
# Trusted Publishing bootstrap caveat. The post-release job then creates the
# GitHub Release with git-cliff-generated notes.

on:
  push:
    tags: ["ashurbanipal-axum-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify-and-build:
    uses: ./.github/workflows/_rust-crate-publish-check.yml
    with:
      tag-prefix: "ashurbanipal-axum-v"
      crate-name: "ashurbanipal-axum"
      crate-dir: "implementations/rust/axum"

  conformance:
    name: Rust — conformance kit (external-URL path)
    needs: verify-and-build
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: rust-axum-publish-conformance-report

  schema-conformance:
    name: Rust — schema conformance
    needs: verify-and-build
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: rust
      start-command: "cargo run -p ashurbanipal-axum --manifest-path implementations/rust/axum/Cargo.toml --example demo"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"

  publish:
    name: cargo publish (crates.io Trusted Publishing)
    needs: [conformance, schema-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this GitHub Environment (Settings > Environments) with
    # required reviewers if a manual approval gate before an irreversible
    # (yank-only) publish is wanted — inert with no protection rules set.
    environment:
      name: crates-io-publish
      url: https://crates.io/crates/ashurbanipal-axum
    permissions:
      contents: read
      id-token: write # required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        working-directory: implementations/rust/axum
        run: cargo publish -p ashurbanipal-axum
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # A Release hiccup must never wedge the already-completed, irreversible
  # crates.io publish in `needs: publish` — hence a separate job + continue-on-error.
  post-release:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/_post-release.yml
    with:
      tag-pattern: '^ashurbanipal-axum-v'
      include-paths: 'implementations/rust/axum/** implementations/rust/core/** frontend/** spec/**'
