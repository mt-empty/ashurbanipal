name: _rust-crate-build-test

# Shared by rust-axum-conformance.yml, rust-actix-web-conformance.yml, and
# (via _rust-crate-publish-check.yml) all three rust-*-publish.yml
# workflows — this is always the same whole-workspace fmt/clippy/test
# pass regardless of which crate triggered the run (implementations/rust/
# is one Cargo workspace), so it takes no per-crate inputs.

on:
  workflow_call:

env:
  DATABASE_URL: postgres://ashurbanipal:ashurbanipal@localhost:5432/ashurbanipal

permissions:
  contents: read

jobs:
  build-and-test:
    name: cargo fmt/clippy/test --lib + seed sync check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ashurbanipal
          POSTGRES_PASSWORD: ashurbanipal
          POSTGRES_DB: ashurbanipal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.7.13
          install: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            implementations/rust -> target
            tools/seed-gen -> target

      - run: mise run conformance:seed-check

      - run: mise run rust
