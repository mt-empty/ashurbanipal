name: GitHub Pages

# Deploys docs/ — the Jekyll-rendered docs and both demos. The live demo
# (docs/demo/live/: its page, PGlite worker, and PGlite's ~11 MB of files) is
# built here and never committed. Needs Settings → Pages → Source set to
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued one waits rather than cancelling a deploy mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build docs/ and the demos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.7.13
          install: false

      # Writes docs/demo/live/ before Jekyll runs, so Jekyll copies it into the site as-is.
      - run: mise run frontend:build-demo-live

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # required to mint the deployment's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
