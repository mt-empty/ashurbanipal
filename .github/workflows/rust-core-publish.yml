name: rust-core-publish

# Publishes implementations/rust/core to crates.io as `ashurbanipal`,
# gated on an ashurbanipal-v* tag (see docs/publishing-checklist.md's per-port
# tag scheme — this crate's tags never share rust-axum-publish.yml's
# ashurbanipal-axum-v* or rust-actix-web-publish.yml's
# ashurbanipal-actix-web-v*; the ashurbanipal-v* glob does not match those
# longer prefixes). Tag/version verification and build+dry-run-package are
# shared with those two workflows via _rust-crate-publish-check.yml — see that
# file's header for the Trusted Publishing bootstrap caveat. The post-release
# job then creates the GitHub Release with git-cliff-generated notes.
#
# `ashurbanipal` has no HTTP surface of its own (framework-agnostic config,
# DbSource backends, filter DSL only), so unlike the axum/actix-web publish
# workflows there is no conformance job here — verify-and-build's
# `mise run rust` already exercises this crate through both adapters' test
# suites.

on:
  push:
    tags: ["ashurbanipal-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify-and-build:
    uses: ./.github/workflows/_rust-crate-publish-check.yml
    with:
      tag-prefix: "ashurbanipal-v"
      crate-name: "ashurbanipal"
      crate-dir: "implementations/rust/core"

  publish:
    name: cargo publish (crates.io Trusted Publishing)
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this GitHub Environment (Settings > Environments) with
    # required reviewers if a manual approval gate before an irreversible
    # (yank-only) publish is wanted — inert with no protection rules set.
    environment:
      name: crates-io-publish
      url: https://crates.io/crates/ashurbanipal
    permissions:
      contents: read
      id-token: write # required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        working-directory: implementations/rust/core
        run: cargo publish -p ashurbanipal
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # A Release hiccup must never wedge the already-completed, irreversible
  # crates.io publish in `needs: publish` — hence a separate job + continue-on-error.
  post-release:
    needs: publish
    permissions:
      contents: write
    continue-on-error: true
    uses: ./.github/workflows/_post-release.yml
    with:
      tag-pattern: '^ashurbanipal-v'
      include-paths: 'implementations/rust/core/** frontend/** spec/**'
