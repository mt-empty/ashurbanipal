name: frontend sync check

on:
  push:
    branches: [main]
    paths:
      - "frontend/dbviewer.html"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/biome.json"
      - "frontend/tsconfig.json"
      - "frontend/tsconfig.test.json"
      - "frontend/test/**"
      - "frontend/*.mjs"
      - "docs/demo/index.html"
      - "mise-tasks/frontend.toml"
      - "spec/fixtures/parser-tests.json"
      - "implementations/rust/**"
      - "implementations/go-nethttp/**"
      - "implementations/spring-boot-starter/**"
      - "implementations/node-express/**"
      - "implementations/flask-python/**"
      - "tools/sync-ports-frontend.sh"
      - "tools/check-frontend-cycles.sh"
      - "tools/check-frontend-api-reference.sh"
      - "tools/e2e-tests/**"
      - "spec/openapi.yaml"
      - ".github/workflows/frontend-sync-check.yml"
  pull_request:
    paths:
      - "frontend/dbviewer.html"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/biome.json"
      - "frontend/tsconfig.json"
      - "frontend/tsconfig.test.json"
      - "frontend/test/**"
      - "frontend/*.mjs"
      - "docs/demo/index.html"
      - "mise-tasks/frontend.toml"
      - "spec/fixtures/parser-tests.json"
      - "implementations/rust/**"
      - "implementations/go-nethttp/**"
      - "implementations/spring-boot-starter/**"
      - "implementations/node-express/**"
      - "implementations/flask-python/**"
      - "tools/sync-ports-frontend.sh"
      - "tools/check-frontend-cycles.sh"
      - "tools/check-frontend-api-reference.sh"
      - "tools/e2e-tests/**"
      - "spec/openapi.yaml"
      - ".github/workflows/frontend-sync-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, e2e lint + typecheck, cycle-check, api-reference-check, unit tests, and verify frontend/dbviewer.html + vendored copies match frontend/src/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.7.13
          install: false

      - run: mise run frontend:lint
      - run: mise run frontend:check-cycles
      - run: mise run frontend:check-api-reference
      - run: mise run frontend:typecheck
      - run: mise run frontend:e2e-lint
      - run: mise run frontend:e2e-typecheck
      - run: mise run frontend:test-unit
      - run: mise run frontend:build-check
      - run: mise run frontend:build-demo-check
      - run: mise run frontend:check-ports-sync
