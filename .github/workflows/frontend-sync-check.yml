name: frontend sync check

on:
  push:
    branches: [main]
    paths:
      - "frontend/dbviewer.html"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "implementations/rust/**"
      - "implementations/go-nethttp/**"
      - "implementations/spring-boot-starter/**"
      - "implementations/node-express/**"
      - "implementations/flask-python/**"
      - "tools/sync-ports-frontend.sh"
      - ".github/workflows/frontend-sync-check.yml"
  pull_request:
    paths:
      - "frontend/dbviewer.html"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "implementations/rust/**"
      - "implementations/go-nethttp/**"
      - "implementations/spring-boot-starter/**"
      - "implementations/node-express/**"
      - "implementations/flask-python/**"
      - "tools/sync-ports-frontend.sh"
      - ".github/workflows/frontend-sync-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: verify frontend/dbviewer.html matches frontend/src/, and vendored copies match it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: false

      - run: mise run frontend:typecheck
      - run: mise run frontend:build-check
      - run: mise run frontend:check-ports-sync
