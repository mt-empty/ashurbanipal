name: spring-boot-starter conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/spring-boot-starter/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/spring-boot-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/spring-boot-starter/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/spring-boot-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Submits the resolved Gradle dependency graph to GitHub's native
  # dependency graph — unlike Cargo/Go/npm, GitHub can't parse Gradle
  # manifests directly, so without this step Gradle deps get no Dependabot
  # security alerts and dependency-review.yml can't see Gradle-side PR
  # diffs. Push-only: the Dependency Submission API needs contents:write,
  # which a pull_request-triggered GITHUB_TOKEN from a fork doesn't have.
  dependency-submission:
    name: Submit Gradle dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: implementations/spring-boot-starter

  build-and-test:
    uses: ./.github/workflows/_spring-build-test.yml

  conformance:
    name: Spring Boot — conformance kit (external-URL path, against the Kotlin demo)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: java
      start-command: "cd implementations/spring-boot-starter && ./gradlew :demo:bootRun"
      start-env: "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/ashurbanipal SPRING_DATASOURCE_USERNAME=ashurbanipal SPRING_DATASOURCE_PASSWORD=ashurbanipal PORT=4100 ASHURBANIPAL_ENABLED=true"
      health-url: "http://localhost:4100/__ashurbanipal/api/tables"
      conformance-url: "http://localhost:4100/__ashurbanipal"
      report-name: spring-boot-conformance-report

  # Same suite, run again (not instead) against a demo started with a
  # second source registered — see rust-axum-conformance.yml's identical
  # job for the rationale (conformance/runner/two_source.rs). Spring's own
  # idiom for the trigger is a profile, not the CONFORMANCE_SECOND_SOURCE
  # env var the other ports use — two_source.rs discovers the second
  # source dynamically either way, so this doesn't need to match them.
  two-source-conformance:
    name: Spring Boot — conformance kit (two-source round-trip)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: java
      start-command: "cd implementations/spring-boot-starter && ./gradlew :demo:bootRun"
      start-env: "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/ashurbanipal SPRING_DATASOURCE_USERNAME=ashurbanipal SPRING_DATASOURCE_PASSWORD=ashurbanipal PORT=4100 ASHURBANIPAL_ENABLED=true SPRING_PROFILES_ACTIVE=conformance-second-source"
      health-url: "http://localhost:4100/__ashurbanipal/api/tables"
      conformance-url: "http://localhost:4100/__ashurbanipal"
      report-name: spring-boot-two-source-conformance-report

  schema-conformance:
    name: Spring Boot — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: java
      start-command: "cd implementations/spring-boot-starter && ./gradlew :demo:bootRun"
      start-env: "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/ashurbanipal SPRING_DATASOURCE_USERNAME=ashurbanipal SPRING_DATASOURCE_PASSWORD=ashurbanipal PORT=4100 ASHURBANIPAL_ENABLED=true"
      health-url: "http://localhost:4100/__ashurbanipal/api/tables"
      conformance-url: "http://localhost:4100/__ashurbanipal"
