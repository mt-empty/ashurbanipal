name: flask-python conformance

on:
  push:
    branches: [main]
    paths:
      - "implementations/flask-python/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/flask-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"
  pull_request:
    paths:
      - "implementations/flask-python/**"
      - "spec/**"
      - "conformance/**"
      - "frontend/dbviewer.html"
      - ".github/workflows/flask-conformance.yml"
      - ".github/workflows/_conformance-behavior.yml"
      - ".github/workflows/_conformance-schema.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_flask-build-test.yml

  conformance:
    name: Flask — conformance kit (external-URL path)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: python
      python-version: "3.12"
      start-command: >-
        tools/sync-ports-frontend.sh &&
        cd implementations/flask-python &&
        uv sync --extra postgres &&
        PORT=4000 uv run python demo/app.py
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: flask-python-conformance-report

  # Same suite, run again (not instead) against a demo started with a
  # second source and labelled siblings — see rust-axum-conformance.yml's
  # identical job for the rationale.
  two-source-conformance:
    name: Flask — conformance kit (two-source round-trip, labelled siblings)
    needs: build-and-test
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      toolchain: python
      python-version: "3.12"
      start-command: >-
        tools/sync-ports-frontend.sh &&
        cd implementations/flask-python &&
        uv sync --extra postgres &&
        PORT=4000 uv run python demo/app.py
      start-env: "CONFORMANCE_SECOND_SOURCE=1 CONFORMANCE_LABELLED_SIBLINGS=1"
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: flask-python-conformance-two-source-report

  # The same suite against the demo on MySQL, MariaDB and SQLite, so each
  # port's other backends meet the protocol too.
  other-backend-conformance:
    name: Flask — conformance kit (${{ matrix.backend }} backend)
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, mariadb, sqlite]
    uses: ./.github/workflows/_conformance-behavior.yml
    with:
      backend: ${{ matrix.backend }}
      toolchain: python
      python-version: "3.12"
      start-command: >-
        tools/sync-ports-frontend.sh &&
        cd implementations/flask-python &&
        uv sync --extra mysql &&
        PORT=4000 uv run python demo/app.py
      start-env: ${{ matrix.backend == 'sqlite' && 'ASHURBANIPAL_BACKEND=sqlite ASHURBANIPAL_SQLITE_PATH=$CONFORMANCE_SQLITE_PATH' || 'ASHURBANIPAL_BACKEND=mysql MYSQL_TEST_URL=$CONFORMANCE_MYSQL_URL' }}
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
      report-name: flask-python-conformance-${{ matrix.backend }}-report

  schema-conformance:
    name: Flask — schema conformance
    needs: build-and-test
    uses: ./.github/workflows/_conformance-schema.yml
    with:
      toolchain: python
      python-version: "3.12"
      start-command: >-
        tools/sync-ports-frontend.sh &&
        cd implementations/flask-python &&
        uv sync --extra postgres &&
        PORT=4000 uv run python demo/app.py
      health-url: "http://localhost:4000/health"
      conformance-url: "http://localhost:4000/__ashurbanipal"
