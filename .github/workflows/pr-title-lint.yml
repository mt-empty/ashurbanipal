name: pr-title-lint

# PRs are squash-merged, so the PR title becomes the commit subject on main.
# git-cliff builds each port's CHANGELOG.md from those subjects
# (implementations/*/CHANGELOG.md, cliff.toml), so they must be Conventional
# Commits. This gate checks the title; non-conforming subjects are dropped
# from the generated notes rather than mis-grouped.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9-]+\))?!?: .+|Revert ".+")'
          if printf '%s\n' "$TITLE" | grep -qE "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: \"$TITLE\"" >&2
            echo "Expected e.g. 'feat(axum): add multi-source mounting' or 'fix: reject unvalidated schema names'." >&2
            echo "Types: feat fix docs style refactor perf test build ci chore revert security (optional (scope), optional ! for breaking)." >&2
            exit 1
          fi
