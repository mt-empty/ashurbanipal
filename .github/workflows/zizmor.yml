name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "mise-tasks/ci.toml"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    paths:
      - ".github/**"
      - "mise-tasks/ci.toml"
      - "mise.toml"
      - "mise.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor audit of .github/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.7.13
          install: false

      - run: mise install aqua:zizmorcore/zizmor

      - run: mise run ci:zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          # Only zizmor is needed; don't pull the repo's full [tools] set.
          MISE_TASK_RUN_AUTO_INSTALL: "false"
