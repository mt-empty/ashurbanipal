[tools]
watchexec = "latest"
node = "26"
pnpm = "latest"

[tasks.build]
description = "cargo build"
run = "cargo build"

[tasks.test]
description = "cargo test (pass a path to run one test, e.g. `mise run test config::tests::name`)"
run = "cargo test"

[tasks.lint]
description = "cargo clippy, denying warnings"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "cargo fmt"
run = "cargo fmt"

[tasks."fmt-check"]
description = "cargo fmt --check"
run = "cargo fmt --check"

[tasks.check]
description = "everything CI would run: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]

[tasks.demo]
description = "run the demo host app at http://localhost:4000/__ashurbanipal"
run = "cargo run --example demo"
sources = ["src/**/*", "examples/**/*.rs", "Cargo.toml"]

[tasks."demo-sibling"]
description = "run a second demo instance on 4001, sibling-polling the one on 4000"
run = "cargo run --example demo"
env = { PORT = "4001", SIBLING_PORT = "4000" }
sources = ["src/**/*", "examples/**/*.rs", "Cargo.toml"]

[tasks.dev]
description = "run the demo host app, auto-rebuilding and restarting on src/ or dbviewer.html changes"
run = "mise watch demo --restart"

[tasks."seed-gen"]
description = "regenerate .devcontainer/db/init/01-seed.sql from tools/seed-gen"
run = "cargo run > ../../.devcontainer/db/init/01-seed.sql"
dir = "tools/seed-gen"

[tasks."test-e2e-install"]
description = "one-time Playwright browser install (Chromium, Firefox, WebKit) for the e2e suite"
run = "pnpm install && pnpm exec playwright install --with-deps chromium firefox webkit"
dir = "tools/e2e-tests"

[tasks."test-e2e"]
description = "run the Playwright e2e suite against dbviewer.html"
run = "pnpm exec playwright test"
dir = "tools/e2e-tests"

[tasks."showcase"]
description = "record a scripted dark-theme walkthrough of dbviewer.html and encode it to a Bayer-dithered tools/e2e-tests/showcase.gif"
run = "./generate-showcase-gif.sh"
dir = "tools/e2e-tests"
