[tools]
watchexec = "latest"
node = "26"
pnpm = "latest"
go = "1.25.3"
java = "temurin-21"
uv = "latest"
"aqua:orhun/git-cliff" = "2"

# ---- top-level umbrella tasks -----------------------------------------
# `mise run check` is everything CI runs, across every implementation.
# `mise run rust` / `spring` / `frontend` / `conformance` are the same
# thing scoped to one layer; each fans out to its own namespaced
# `<layer>:*` subtasks below.

[tasks.check]
description = "everything CI would run, across every implementation: rust, spring, go, node, flask, frontend, conformance, docs, changelog"
depends = ["rust", "spring", "go", "node", "flask", "frontend", "conformance", "docs", "changelog"]

[tasks.rust]
description = "rust implementation checks (default features): fmt-check, lint, test, integration-test"
depends = ["rust:fmt-check", "rust:lint", "rust:test", "rust:integration-test", "rust:integration-test-actix"]

[tasks."rust:backends"]
description = "non-default backend checks: sqlite/mysql feature lint + unit + integration tests (needs MYSQL_TEST_URL, MARIADB_TEST_URL). Not in `rust` or `check` — run it explicitly; CI runs it in rust-axum-conformance.yml's non-default-backend-tests job."
depends = [
    "rust:lint-all-features",
    "rust:test-sqlite",
    "rust:test-mysql",
    "rust:integration-test-sqlite",
    "rust:integration-test-mysql",
]

[tasks.spring]
description = "spring-boot-starter implementation checks: build, test"
depends = ["spring:check"]

[tasks.go]
description = "go-nethttp implementation checks: build, vet, fmt-check, test"
depends = ["go:build", "go:vet", "go:fmt-check", "go:test"]

[tasks.node]
description = "node-express implementation checks: lint, typecheck, build, test"
depends = ["node:lint", "node:typecheck", "node:build", "node:test"]

[tasks.flask]
description = "flask-python implementation checks: lint, fmt-check, test"
depends = ["flask:lint", "flask:fmt-check", "flask:test"]

[tasks.frontend]
description = "frontend checks: lint, cycle check, api-reference drift, typecheck, unit tests, build-check, vendored-copy sync, demo sync, Playwright e2e suite"
depends = ["frontend:lint", "frontend:check-cycles", "frontend:check-api-reference", "frontend:typecheck", "frontend:test-unit", "frontend:build-check", "frontend:check-ports-sync", "frontend:build-demo-check", "frontend:test-e2e"]

[tasks.docs]
description = "docs checks: hardcoded version strings in sync with docs/publishing-checklist.md"
depends = ["docs:check-versions"]

[tasks."docs:check-versions"]
description = "verify readme.md's Spring coordinate matches the publishing-checklist ledger (and the ledger matches the highest Spring release tag); --fix rewrites readme.md"
run = "tools/check-doc-versions.sh"

# ---- changelog:* ------------------------------------------------------
# One implementations/<port>/CHANGELOG.md per published port. The 0.3.0
# floor is hand-written; git-cliff only ever generates > 0.3.0.
# `changelog:<port>` prints the not-yet-released section — at release time
# paste it under a new `## [X.Y.Z]` heading (docs/publishing-checklist.md).
# The publish workflows generate the same notes with `git cliff --current`.
# Each --tag-pattern is a single prefix (git-cliff --current errors on '^(a|b)').

[tasks.changelog]
description = "changelog checks: each port's CHANGELOG.md top section matches its manifest version"
depends = ["changelog:check"]

[tasks."changelog:check"]
description = "verify each implementations/<port>/CHANGELOG.md top section matches that port's manifest version (offline; no git-cliff)"
run = "tools/check-changelogs.sh"

[tasks."changelog:rust-core"]
description = "print the unreleased CHANGELOG section for the ashurbanipal core crate"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-v' --include-path 'implementations/rust/core/**' 'spec/**'"

[tasks."changelog:rust-axum"]
description = "print the unreleased CHANGELOG section for ashurbanipal-axum"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-axum-v' --include-path 'implementations/rust/axum/**' 'implementations/rust/core/**' 'frontend/**' 'spec/**'"

[tasks."changelog:rust-actix-web"]
description = "print the unreleased CHANGELOG section for ashurbanipal-actix-web"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-actix-web-v' --include-path 'implementations/rust/actix-web/**' 'implementations/rust/core/**' 'frontend/**' 'spec/**'"

[tasks."changelog:node-express"]
description = "print the unreleased CHANGELOG section for ashurbanipal-node-express"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-node-express-v' --include-path 'implementations/node-express/**' 'frontend/**' 'spec/**'"

[tasks."changelog:flask-python"]
description = "print the unreleased CHANGELOG section for ashurbanipal-flask"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-flask-v' --include-path 'implementations/flask-python/**' 'frontend/**' 'spec/**'"

[tasks."changelog:spring-boot-starter"]
description = "print the unreleased CHANGELOG section for the Spring Boot starter"
run = "git-cliff --unreleased --strip header --tag-pattern '^ashurbanipal-spring-boot-starter-v' --include-path 'implementations/spring-boot-starter/**' 'frontend/**' 'spec/**'"

[tasks."changelog:go-nethttp"]
description = "print the unreleased CHANGELOG section for the Go/net-http port"
run = "git-cliff --unreleased --strip header --tag-pattern '^implementations/go-nethttp/v' --include-path 'implementations/go-nethttp/**' 'frontend/**' 'spec/**'"

[tasks."frontend:install"]
description = "pnpm install --frozen-lockfile"
run = "pnpm install --frozen-lockfile"
dir = "frontend"

[tasks."frontend:build"]
description = "bundle frontend/src/ into frontend/dbviewer.html, then regenerate the docs/demo/index.html GitHub Pages demo from it"
run = "node build.mjs && node build-demo.mjs"
dir = "frontend"
depends = ["frontend:install"]

[tasks."frontend:typecheck"]
description = "tsc --noEmit over frontend/src/ (DOM libs) and frontend/test/ (node types)"
run = ["pnpm exec tsc --noEmit", "pnpm exec tsc --noEmit -p tsconfig.test.json"]
dir = "frontend"
depends = ["frontend:install"]

[tasks."frontend:test-unit"]
description = "node --test over frontend/test/ — pure-logic units (the DSL parser); no browser"
run = "pnpm run test"
dir = "frontend"
depends = ["frontend:install"]

[tasks."frontend:lint"]
description = "biome check over frontend/src/ (format + recommended lint; see frontend/biome.json)"
run = "pnpm run lint"
dir = "frontend"
depends = ["frontend:install"]

[tasks."frontend:check-cycles"]
description = "fail if frontend/src/ has any value-import cycle (docs/frontend-style-guide.md §1)"
run = "sh tools/check-frontend-cycles.sh"

[tasks."frontend:check-api-reference"]
description = "fail if the filter operator list / limits drift between spec/openapi.yaml and frontend/src/"
run = "sh tools/check-frontend-api-reference.sh"

[tasks."frontend:build-check"]
description = "verify frontend/dbviewer.html is what frontend/src/ currently builds to"
run = '''
cp dbviewer.html /tmp/ashurbanipal-dbviewer-committed.html
node build.mjs
if ! diff -q dbviewer.html /tmp/ashurbanipal-dbviewer-committed.html > /dev/null; then
  echo "frontend/dbviewer.html is out of date — run \`mise run frontend:build\` and commit the result" >&2
  cp /tmp/ashurbanipal-dbviewer-committed.html dbviewer.html
  exit 1
fi
'''
dir = "frontend"
depends = ["frontend:install"]

[tasks."frontend:build-demo"]
description = "bundle a synthetic in-browser demo (fake data, no backend) into docs/demo/index.html for GitHub Pages — runs automatically as part of frontend:build; this is for explicit standalone use"
run = "node build-demo.mjs"
dir = "frontend"
depends = ["frontend:build"]

[tasks."frontend:build-demo-check"]
description = "verify docs/demo/index.html is what frontend/src/ + dbviewer.html currently builds to"
run = '''
cp ../docs/demo/index.html /tmp/ashurbanipal-demo-committed.html
node build-demo.mjs
if ! diff -q ../docs/demo/index.html /tmp/ashurbanipal-demo-committed.html > /dev/null; then
  echo "docs/demo/index.html is out of date — run \`mise run frontend:build-demo\` and commit the result" >&2
  cp /tmp/ashurbanipal-demo-committed.html ../docs/demo/index.html
  exit 1
fi
'''
dir = "frontend"
depends = ["frontend:build"]

[tasks."frontend:sync-ports"]
description = "sync the canonical frontend and re-pin its Rust, Go, Spring, Node, and Flask consumers"
run = "tools/sync-ports-frontend.sh"

[tasks."frontend:check-ports-sync"]
description = "verify vendored frontend copies and pins match frontend/dbviewer.html"
run = "tools/sync-ports-frontend.sh --check"

[tasks.conformance]
description = "conformance suite: seed sync check + black-box conformance + schema fuzzing"
depends = ["conformance:seed-check", "conformance:test", "conformance:schema-test"]

# ---- rust:* -------------------------------------------------------------

[tasks."rust:build"]
description = "cargo build"
run = "cargo build"
dir = "implementations/rust"

[tasks."rust:test"]
description = "cargo test --lib: the crate's own inline unit tests (pass a path to run one test, e.g. `mise run rust:test config::tests::name`)"
# --lib excludes the `[[test]] name = "conformance"` integration target
# (Cargo.toml) — plain `cargo test` picks that up too, which would run the
# same spawn-heavy conformance suite conformance:test already owns, a second
# time, concurrently with it (check's rust and conformance deps run in
# parallel). Doubling up that suite doubles concurrent spawned `demo`
# processes and DB connections and has surfaced as spurious
# connection-reset/incomplete-response failures under CI resource pressure,
# not a logic bug.
run = "cargo test --lib"
dir = "implementations/rust"

[tasks."rust:test-sqlite"]
description = "cargo test --lib --features sqlite: the sqlite-feature inline unit tests (core/src/db/sqlite.rs; sqlite::memory:, no service)"
run = "cargo test --lib --features sqlite"
dir = "implementations/rust"

[tasks."rust:test-mysql"]
description = "cargo test --lib --features mysql: the mysql-feature inline unit tests (core/src/db/mysql.rs; needs MYSQL_TEST_URL, MARIADB_TEST_URL)"
run = "cargo test --lib --features mysql"
dir = "implementations/rust"

[tasks."rust:integration-test"]
description = "cargo test --test schema_isolation --test multi_source --test table_listing_privileges: axum's own Postgres-backed integration tests (needs DATABASE_URL)"
# Separate from rust:test (--lib) for the same reason that task excludes
# the conformance target: these open their own DB pools and would add
# concurrent connection pressure if run alongside conformance:test.
# Excludes schema_isolation_mysql.rs on purpose — that file requires the
# mysql feature + MYSQL_TEST_URL and documents itself as not run in CI
# (see its own module doc comment), same as the rest of the mysql feature.
run = "cargo test --test schema_isolation --test multi_source --test table_listing_privileges"
dir = "implementations/rust/axum"

[tasks."rust:integration-test-actix"]
description = "cargo test --test multi_source: actix-web's own Postgres-backed integration tests (needs DATABASE_URL)"
# No schema_isolation.rs equivalent here — that tests core::PgPoolSource
# directly, already covered once via axum's copy.
run = "cargo test --test multi_source"
dir = "implementations/rust/actix-web"

[tasks."rust:integration-test-mysql"]
description = "cargo test --features mysql --test schema_isolation_mysql --test table_listing_privileges_mysql: axum's MySQL/MariaDB integration tests (needs MYSQL_TEST_URL, MARIADB_TEST_URL)"
run = "cargo test --features mysql --test schema_isolation_mysql --test table_listing_privileges_mysql"
dir = "implementations/rust/axum"

[tasks."rust:integration-test-sqlite"]
description = "cargo test --features sqlite --test multi_source_sqlite: axum's SQLite router-level integration test (in-memory, no service)"
run = "cargo test --features sqlite --test multi_source_sqlite"
dir = "implementations/rust/axum"

[tasks."rust:lint"]
description = "cargo clippy, denying warnings"
run = "cargo clippy -- -D warnings"
dir = "implementations/rust"

[tasks."rust:lint-all-features"]
description = "cargo clippy --features sqlite,mysql, denying warnings: covers the sqlite/mysql DbSource impls the default lint never compiles"
run = "cargo clippy --features sqlite,mysql -- -D warnings"
dir = "implementations/rust"

[tasks."rust:fmt"]
description = "cargo fmt"
run = "cargo fmt"
dir = "implementations/rust"

[tasks."rust:fmt-check"]
description = "cargo fmt --check"
run = "cargo fmt --check"
dir = "implementations/rust"

[tasks."rust:demo"]
description = "run the demo host app at http://localhost:4000/__ashurbanipal"
run = "cargo run -p ashurbanipal-axum --example demo"
dir = "implementations/rust/axum"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

[tasks."rust:demo-sibling"]
description = "run a second demo instance on 4001, sibling-polling the one on 4000"
run = "cargo run -p ashurbanipal-axum --example demo"
env = { PORT = "4001", SIBLING_PORT = "4000" }
dir = "implementations/rust/axum"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

[tasks."rust:dev"]
description = "run the demo host app, auto-rebuilding and restarting on src/ or dbviewer.html changes"
run = "mise watch rust:demo --restart"

# ---- actix:* --------------------------------------------------------------
# No actix:fmt-check/lint/test — rust:fmt-check/rust:lint/rust:test already
# run bare (no -p/--workspace) from the virtual workspace root
# (implementations/rust/Cargo.toml) and reach every member — axum, core,
# and this crate — since Cargo defaults to all members there with no
# explicit default-members needed. Only the demo binary is genuinely
# per-crate.

[tasks."actix:demo"]
description = "run the actix-web demo host app at http://localhost:4000/__ashurbanipal"
run = "cargo run -p ashurbanipal-actix-web --example demo"
dir = "implementations/rust/actix-web"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

[tasks."actix:demo-sibling"]
description = "run a second actix-web demo instance on 4001, sibling-polling the one on 4000"
run = "cargo run -p ashurbanipal-actix-web --example demo"
env = { PORT = "4001", SIBLING_PORT = "4000" }
dir = "implementations/rust/actix-web"
sources = ["src/**/*", "../core/src/**/*", "examples/**/*.rs", "Cargo.toml", "../core/Cargo.toml", "frontend/dbviewer.html"]

[tasks."actix:dev"]
description = "run the actix-web demo host app, auto-rebuilding and restarting on src/ or dbviewer.html changes"
run = "mise watch actix:demo --restart"

# ---- spring:* -----------------------------------------------------------

[tasks."spring:build"]
description = "gradle build (compile + assemble)"
run = "./gradlew build"
dir = "implementations/spring-boot-starter"

[tasks."spring:test"]
description = "gradle test"
run = "./gradlew test"
dir = "implementations/spring-boot-starter"

[tasks."spring:check"]
description = "gradle build + test"
depends = ["spring:build", "spring:test"]

[tasks."spring:demo"]
description = "host demo app at http://localhost:4100/__ashurbanipal"
run = "./gradlew :demo:bootRun"
dir = "implementations/spring-boot-starter"
# Host is "db", matching DATABASE_URL's host in the devcontainer (set in
# .devcontainer/devcontainer.json) — Spring's demo module takes its own
# JDBC-shaped datasource vars instead of parsing DATABASE_URL.
env = { SPRING_DATASOURCE_URL = "jdbc:postgresql://db:5432/ashurbanipal", SPRING_DATASOURCE_USERNAME = "ashurbanipal", SPRING_DATASOURCE_PASSWORD = "ashurbanipal", ASHURBANIPAL_ENABLED = "true" }
sources = ["src/main/kotlin/**/*.kt", "demo/src/**/*", "../../frontend/dbviewer.html"]

[tasks."spring:dev"]
description = "run the demo host app, auto-restarting on implementations/spring-boot-starter/{src,demo} or frontend/dbviewer.html changes"
run = "mise watch spring:demo --restart"

# ---- go:* -----------------------------------------------------------------

[tasks."go:build"]
description = "go build ./..."
run = "go build ./..."
dir = "implementations/go-nethttp"

[tasks."go:vet"]
description = "go vet ./..."
run = "go vet ./..."
dir = "implementations/go-nethttp"

[tasks."go:fmt"]
description = "gofmt -w ."
run = "gofmt -w ."
dir = "implementations/go-nethttp"

[tasks."go:fmt-check"]
description = "gofmt -l . (fails if any file needs reformatting)"
run = '''
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "gofmt would reformat:" >&2
  echo "$unformatted" >&2
  exit 1
fi
'''
dir = "implementations/go-nethttp"

[tasks."go:test"]
description = "go test -race ./... (integration_test.go needs DATABASE_URL + the conformance seed applied)"
run = "go test -race ./..."
dir = "implementations/go-nethttp"

[tasks."go:demo"]
description = "run the demo host app at http://localhost:4000/__ashurbanipal"
run = "go run ./cmd/demo"
dir = "implementations/go-nethttp"
sources = ["*.go", "cmd/demo/**/*.go", "frontend/dbviewer.html"]

[tasks."go:dev"]
description = "run the demo host app, auto-rebuilding and restarting on implementations/go-nethttp/{*.go,cmd/demo} or frontend/dbviewer.html changes"
run = "mise watch go:demo --restart"

# ---- node:* ---------------------------------------------------------------

[tasks."node:install"]
description = "pnpm install --frozen-lockfile"
run = "pnpm install --frozen-lockfile"
dir = "implementations/node-express"

[tasks."node:lint"]
description = "biome check ."
run = "pnpm run lint"
dir = "implementations/node-express"
depends = ["node:install"]

[tasks."node:typecheck"]
description = "tsc --noEmit"
run = "pnpm run typecheck"
dir = "implementations/node-express"
depends = ["node:install"]

[tasks."node:build"]
description = "tsc build + vendor the frontend into dist/"
run = "pnpm run build"
dir = "implementations/node-express"
depends = ["node:install"]

[tasks."node:test"]
description = "vitest run (fixture + kill-switch tests, no database needed)"
run = "pnpm test"
dir = "implementations/node-express"
depends = ["node:install"]

[tasks."node:demo"]
description = "host demo app at http://localhost:4000/__ashurbanipal (DB_BACKEND selects postgres|sqlite|mysql)"
run = "pnpm run demo"
dir = "implementations/node-express"
depends = ["node:install"]
sources = ["src/**/*.ts", "demo/**/*.ts", "frontend/dbviewer.html"]

[tasks."node:dev"]
description = "run the demo host app, auto-restarting on implementations/node-express/{src,demo} or frontend/dbviewer.html changes"
run = "mise watch node:demo --restart"

# ---- flask:* --------------------------------------------------------------

[tasks."flask:install"]
description = "uv sync --extra dev into implementations/flask-python/.venv (Python pinned by .python-version)"
run = "uv sync -q --extra dev"
dir = "implementations/flask-python"

[tasks."flask:lint"]
description = "ruff check ."
run = "uv run ruff check ."
dir = "implementations/flask-python"
depends = ["flask:install"]

[tasks."flask:fmt-check"]
description = "ruff format --check ."
run = "uv run ruff format --check ."
dir = "implementations/flask-python"
depends = ["flask:install"]

[tasks."flask:test"]
description = "pytest -q (postgres/mysql integration tests skip without DATABASE_URL/MYSQL_TEST_URL/MARIADB_TEST_URL)"
run = "uv run pytest -q"
dir = "implementations/flask-python"
depends = ["flask:install"]

[tasks."flask:demo"]
description = "host demo app at http://localhost:4000/__ashurbanipal (ASHURBANIPAL_BACKEND selects postgres|sqlite|mysql)"
run = "uv run python demo/app.py"
dir = "implementations/flask-python"
depends = ["flask:install"]
sources = ["ashurbanipal/**/*.py", "demo/**/*.py", "ashurbanipal/frontend/dbviewer.html"]

[tasks."flask:dev"]
description = "run the demo host app, auto-restarting on implementations/flask-python/{ashurbanipal,demo} or vendored frontend/dbviewer.html changes"
run = "mise watch flask:demo --restart"

# ---- frontend:* ---------------------------------------------------------

[tasks."frontend:test-e2e-install"]
description = "one-time Playwright browser install (Chromium, Firefox, WebKit) for the e2e suite"
run = "pnpm install && pnpm exec playwright install --with-deps chromium firefox webkit"
dir = "tools/e2e-tests"

[tasks."frontend:test-e2e"]
description = "run the Playwright e2e suite against dbviewer.html"
run = "pnpm exec playwright test"
dir = "tools/e2e-tests"

[tasks."frontend:showcase"]
description = "record a scripted dark-theme walkthrough of dbviewer.html and encode it to a Bayer-dithered tools/e2e-tests/showcase.gif"
run = "./generate-showcase-gif.sh"
dir = "tools/e2e-tests"

# ---- conformance:* --------------------------------------------------------

[tasks."conformance:seed-gen"]
description = "regenerate .devcontainer/db/init/01-seed.sql and conformance/seed/seed.sql from tools/seed-gen (same generator, kept identical)"
run = "cargo run > ../../.devcontainer/db/init/01-seed.sql && cp ../../.devcontainer/db/init/01-seed.sql ../../conformance/seed/seed.sql"
dir = "tools/seed-gen"

[tasks."conformance:seed-check"]
description = "verify .devcontainer/db/init/01-seed.sql and conformance/seed/seed.sql match tools/seed-gen's current output"
run = "tools/check-seed-sync.sh"

[tasks."conformance:test"]
description = "run the conformance kit (spawns the Rust implementation by default; set ASHURBANIPAL_CONFORMANCE_URL to target an external implementation instead)"
run = "cargo test --test conformance"
dir = "implementations/rust"
# Spawned mode opens one `demo` OS process per test, each with its own
# 5-connection pool against DATABASE_URL — on a high-core-count machine,
# default (num-CPUs) test-thread parallelism can multiply past Postgres's
# default max_connections (100) and surface as spurious connection-reset
# failures, not a logic bug. Capping test threads keeps peak concurrent
# connections well under that regardless of host CPU count; the suite is
# fast enough that this costs a couple of seconds, not minutes. Harmless,
# and unused, against an external target.
env = { RUST_TEST_THREADS = "8" }

[tasks."conformance:report"]
description = "run the conformance kit and write conformance-report.json (suite version, target, pass/fail per requirement ID)"
run = "bash conformance/runner/report.sh"

[tasks."conformance:schema-install"]
description = "one-time install of schemathesis (layer 2 shape-conformance fuzzer, docs/design.md §4.2) into a local venv"
run = "python3 -m venv .venv-schemathesis && .venv-schemathesis/bin/pip install --upgrade pip schemathesis"

[tasks."conformance:schema-test"]
description = "fire schemathesis at spec/openapi.yaml (layer 2 shape conformance, docs/design.md §4.2) — spawns the Rust demo by default, or set ASHURBANIPAL_CONFORMANCE_URL to target an external implementation instead; run conformance:schema-install first"
run = "bash conformance/runner/schema-check.sh"
