[tools]
watchexec = "latest"
node = "26"
pnpm = "latest"
go = "1.25.3"
java = "temurin-21"
uv = "latest"
"aqua:orhun/git-cliff" = "2"

[settings]
# Pin every tool's exact resolved version + checksum in mise.lock (committed);
# the specs above stay loose. Keeps CI and every clone on the same bytes.
lockfile = true

[task_config]
# mise-tasks/ is already a default search dir; naming it here makes the
# per-layer split visible from this file.
includes = ["mise-tasks"]

# ---- top-level umbrella tasks -----------------------------------------
# `mise run check` is everything CI runs, across every implementation.
# `mise run rust` / `spring` / `frontend` / `conformance` are the same
# thing scoped to one layer; each fans out to its own namespaced
# `<layer>:*` subtasks in mise-tasks/.

[tasks.check]
description = "everything CI would run, across every implementation: rust, spring, go, node, flask, frontend, conformance, docs, changelog"
depends = ["rust", "spring", "go", "node", "flask", "frontend", "conformance", "docs", "changelog"]

[tasks.rust]
description = "rust implementation checks (default features): fmt-check, lint, test, integration-test"
depends = ["rust:fmt-check", "rust:lint", "rust:test", "rust:integration-test", "rust:integration-test-actix"]

[tasks."rust:backends"]
description = "non-default backend checks: sqlite/mysql feature lint + unit + integration tests (needs MYSQL_TEST_URL, MARIADB_TEST_URL). Not in `rust` or `check` — run it explicitly; CI runs it in rust-axum-conformance.yml's non-default-backend-tests job."
depends = [
    "rust:lint-all-features",
    "rust:test-sqlite",
    "rust:test-mysql",
    "rust:integration-test-sqlite",
    "rust:integration-test-mysql",
]

[tasks.spring]
description = "spring-boot-starter implementation checks: build, test"
depends = ["spring:check"]

[tasks.go]
description = "go-nethttp implementation checks: build, vet, fmt-check, test"
depends = ["go:build", "go:vet", "go:fmt-check", "go:test"]

[tasks.node]
description = "node-express implementation checks: lint, typecheck, build, test"
depends = ["node:lint", "node:typecheck", "node:build", "node:test"]

[tasks.flask]
description = "flask-python implementation checks: lint, fmt-check, test"
depends = ["flask:lint", "flask:fmt-check", "flask:test"]

[tasks.frontend]
description = "frontend checks: lint, cycle check, api-reference drift, typecheck, unit tests, build-check, vendored-copy sync, demo sync, Playwright e2e suite"
depends = ["frontend:lint", "frontend:check-cycles", "frontend:check-api-reference", "frontend:typecheck", "frontend:test-unit", "frontend:build-check", "frontend:check-ports-sync", "frontend:build-demo-check", "frontend:test-e2e"]

[tasks.docs]
description = "docs checks: version strings vs. publishing-checklist ledger; feature-backlog index vs. entry headers"
depends = ["docs:check-versions", "docs:backlog-index-check"]

[tasks.changelog]
description = "changelog checks: each port's CHANGELOG.md top section matches its manifest version"
depends = ["changelog:check"]

[tasks.conformance]
description = "conformance suite: seed sync check + black-box conformance + schema fuzzing"
depends = ["conformance:seed-check", "conformance:test", "conformance:schema-test"]
