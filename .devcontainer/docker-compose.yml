services:
  app:
    image: mcr.microsoft.com/devcontainers/rust:2-1-bookworm
    volumes:
      - ..:/workspaces/ashurbanipal:cached
      - claude-config:/home/vscode/.claude
    command: sleep infinity
    depends_on:
      - db
      - mysql

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ashurbanipal
      POSTGRES_PASSWORD: ashurbanipal
      POSTGRES_DB: ashurbanipal
    volumes:
      - postgres-data-v2:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  # Backs the opt-in `mysql` Cargo feature's tests only (MYSQL_TEST_URL) —
  # not part of any CI workflow, same zero-CI-footprint precedent as sqlite.
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ashurbanipal
      MYSQL_USER: ashurbanipal
      MYSQL_PASSWORD: ashurbanipal
      MYSQL_DATABASE: ashurbanipal
    volumes:
      - mysql-data-v1:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  postgres-data-v2:
  mysql-data-v1:
  claude-config:
